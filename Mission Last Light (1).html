<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mission Last Light</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout concept: a fixed 1280x720 landscape stage, scaled to fit and letterboxed. Starfield sits behind one page layer; a persistent HUD sits above it. */
:root{
  --void:#04070d; --deep:#070d18; --panel:#0b1422; --panel2:#101c30;
  --line:#1f3856; --line2:#2c4f78;
  --cyan:#46e0ff; --cyan2:#18a3c4; --amber:#ffb23e; --red:#ff4a5a; --green:#5cf2b0;
  --ink:#e8f2fc; --mute:#8da6c2; --faint:#566f8c;
  --f-d:'Chakra Petch','Arial Narrow',sans-serif;
  --f-b:'Barlow','Segoe UI',sans-serif;
  --f-m:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --micro:150ms; --ui:280ms; --game:480ms; --cine:1100ms;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
html,body{height:100%;margin:0}
*{box-sizing:border-box}
body{background:var(--void);color:var(--ink);font:500 14px/1.4 var(--f-b);padding-inline:16px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input{font-family:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* viewport + scaling */
.vp{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.fit{flex:1;width:100%;min-height:0;display:flex;align-items:center;justify-content:center}
.frame{position:relative;flex:none}
.stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:var(--void);border:1px solid var(--line);isolation:isolate}
.rotate-hint{display:none;font:500 12px var(--f-m);color:var(--mute);text-align:center;padding-bottom:8px}
@media (orientation:portrait){.rotate-hint{display:block}}
.bg{position:absolute;inset:0;background:radial-gradient(900px 500px at 78% 30%,rgba(24,163,196,.16),transparent 60%),radial-gradient(700px 500px at 10% 90%,rgba(60,50,140,.18),transparent 60%),linear-gradient(180deg,#050912,#04070d)}
canvas.stars{position:absolute;inset:0;width:1280px;height:720px}
.scan-lines{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);z-index:8}

/* layers */
.layer{position:absolute;inset:0;z-index:2}
.page{position:absolute;inset:0;padding:84px 40px 34px;display:flex;flex-direction:column;gap:14px}
.page.full{padding-top:0}
.pg-wrap{position:absolute;inset:0;will-change:transform,opacity}

/* HUD */
.hud{position:absolute;left:0;right:0;top:0;height:64px;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:linear-gradient(180deg,rgba(4,7,13,.92),rgba(4,7,13,0));font-family:var(--f-m)}
.hud .h-mis{font:700 15px var(--f-d);letter-spacing:.18em}
.hud .h-ph{font-size:11px;color:var(--mute);letter-spacing:.14em;margin-top:2px}
.hud .h-ph b{color:var(--cyan);font-weight:600}
.hud .h-c{position:absolute;left:50%;transform:translateX(-50%);font:600 20px var(--f-m);letter-spacing:.12em;color:var(--ink)}
.hud .h-r{display:flex;align-items:center;gap:20px}
.stat{display:flex;flex-direction:column;align-items:flex-end;min-width:74px}
.stat small{font-size:10px;letter-spacing:.16em;color:var(--mute)}
.stat .num{font:600 18px var(--f-m)}
.stat.warn .num{color:var(--amber)}
.stat.crit .num{color:var(--red);animation:hudpulse .6s ease-in-out infinite alternate}
.hud.dim{opacity:.55}
.hc-btn{width:44px;height:44px;border:1px solid var(--line2);background:rgba(11,20,34,.7);border-radius:3px;font:600 11px var(--f-m);cursor:pointer;transition:transform var(--micro),border-color var(--micro)}
.hc-btn:hover{border-color:var(--cyan)}
.hc-btn[aria-pressed=true]{background:var(--cyan);color:#021018}
.rail{position:absolute;left:0;right:0;bottom:0;height:5px;z-index:6;display:flex;gap:2px;padding:0 24px 0}
.rail i{flex:1;background:#12233a;transition:background var(--ui)}
.rail i.done{background:var(--cyan2)}
.rail i.cur{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.crit-vignette{position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(255,40,60,.35));animation:critflash .9s ease-in-out infinite alternate}
.hc .panel{border-color:#7fb4e6}
.hc{--mute:#c6d8ec;--faint:#9db6d0;--line:#5b86b3}

/* type */
.pidx{font:600 11px var(--f-m);letter-spacing:.2em;color:var(--cyan)}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.phead h1{font:700 32px/1.05 var(--f-d);letter-spacing:.06em;margin-top:2px}
.phead p{color:var(--mute);max-width:640px;margin-top:6px;font-size:15px}
.tag{font:600 11px var(--f-m);letter-spacing:.18em;color:var(--cyan)}
.lab{font:600 10px var(--f-m);letter-spacing:.18em;color:var(--mute);text-transform:uppercase}
.mono{font-family:var(--f-m)}
.num{font-variant-numeric:tabular-nums}
.h2{font:700 18px var(--f-d);letter-spacing:.08em}
.dim{color:var(--mute)}
.good{color:var(--green)}.warnc{color:var(--amber)}.bad{color:var(--red)}.cy{color:var(--cyan)}

/* layout helpers */
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.gap{gap:14px}.gap8{gap:8px}.gap20{gap:22px}
.grow{flex:1;min-width:0;min-height:0}
.between{justify-content:space-between}
.end{justify-content:flex-end}
.wrap{flex-wrap:wrap}

/* motion */
.rise{animation:rise var(--game) var(--ease) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-14px) rotate(1.2deg)}}
@keyframes breathe{0%,100%{filter:drop-shadow(0 0 6px rgba(70,224,255,.35))}50%{filter:drop-shadow(0 0 22px rgba(70,224,255,.85))}}
@keyframes hudpulse{from{opacity:1}to{opacity:.45}}
@keyframes critflash{from{opacity:.25}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes ringp{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.25);opacity:0}}
@keyframes dash{to{stroke-dashoffset:-40}}
@keyframes sweep{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-4px,2px)}40%{transform:translate(3px,-3px)}60%{transform:translate(-2px,3px)}80%{transform:translate(3px,1px)}}
@keyframes flick{0%,100%{opacity:1}8%{opacity:.2}12%{opacity:1}55%{opacity:.7}58%{opacity:.15}62%{opacity:1}}
@keyframes snap{0%{transform:translateX(-26px);opacity:0}60%{transform:translateX(3px);opacity:1}100%{transform:none}}
@keyframes flame{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.35)}}
@keyframes glitch{0%,100%{transform:none;clip-path:inset(0)}20%{transform:translate(-6px,0);clip-path:inset(10% 0 60% 0)}40%{transform:translate(6px,0);clip-path:inset(55% 0 10% 0)}60%{transform:translate(-3px,0);clip-path:inset(30% 0 35% 0)}80%{transform:translate(4px,0);clip-path:inset(70% 0 5% 0)}}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes drawline{to{stroke-dashoffset:0}}
@keyframes packet{0%{transform:translateX(0);opacity:0}15%{opacity:1}100%{transform:translateX(var(--d,300px));opacity:1}}
@keyframes boot{0%{opacity:0}30%{opacity:1}35%{opacity:.2}50%{opacity:1}100%{opacity:1}}
@keyframes blackout{from{opacity:0}to{opacity:.92}}
.floaty{animation:float 6s ease-in-out infinite}
.rot{transform-origin:center;transform-box:fill-box;animation:spin 40s linear infinite}
.rot.slow{animation-duration:70s}.rot.fast{animation-duration:12s}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.breathe{display:inline-flex;animation:breathe 2.4s ease-in-out infinite}
.flick{animation:flick 1.8s linear infinite}
.shake{animation:shake .4s linear 2}
.glitchy{animation:glitch .5s steps(2) infinite}
.snap{animation:snap var(--ui) var(--ease) both}
.flame{transform-origin:right center;transform-box:fill-box;animation:flame .12s linear infinite}
.scanring{fill:none;stroke:var(--cyan);stroke-width:1.5;transform-origin:center;transform-box:fill-box;animation:ringp 2.4s ease-out infinite}
.flow{animation:dash 1s linear infinite}

/* page transitions */
.pg-wrap.in-fade{animation:t-fade-in 450ms var(--ease) both}
.pg-wrap.out-fade{animation:t-fade-out 300ms ease-in both;pointer-events:none}
.pg-wrap.in-zoom{animation:t-zoom-in 1100ms var(--ease) both}
.pg-wrap.out-zoom{animation:t-zoom-out 900ms ease-in both;pointer-events:none}
.pg-wrap.in-slide{animation:t-slide-in 600ms var(--ease) both}
.pg-wrap.out-slide{animation:t-slide-out 600ms var(--ease) both;pointer-events:none}
.pg-wrap.in-eng{animation:t-eng-in 900ms var(--ease) both}
.pg-wrap.out-eng{animation:t-eng-out 700ms ease-in both;pointer-events:none}
.pg-wrap.in-launch{animation:t-launch-in 1000ms var(--ease) both}
.pg-wrap.out-launch{animation:t-launch-out 700ms ease-in both;pointer-events:none}
.pg-wrap.in-rdv{animation:t-zoom-in 1100ms var(--ease) both}
.pg-wrap.out-rdv{animation:t-zoom-out 900ms ease-in both;pointer-events:none}
.pg-wrap.in-data{animation:t-data-in 900ms var(--ease) both}
.pg-wrap.out-data{animation:t-fade-out 400ms ease-in both;pointer-events:none}
@keyframes t-fade-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes t-fade-out{to{opacity:0;transform:translateY(-10px)}}
@keyframes t-zoom-in{0%,25%{opacity:0;transform:scale(.55);filter:blur(8px)}100%{opacity:1;transform:none;filter:none}}
@keyframes t-zoom-out{to{opacity:0;transform:scale(2.6);filter:blur(10px)}}
@keyframes t-slide-in{from{transform:translateX(100%)}to{transform:none}}
@keyframes t-slide-out{to{transform:translateX(-100%);opacity:.3}}
@keyframes t-eng-in{0%{clip-path:inset(0 0 100% 0)}100%{clip-path:inset(0)}}
@keyframes t-eng-out{to{transform:perspective(900px) rotateY(40deg) scale(.85);opacity:0}}
@keyframes t-launch-in{0%{opacity:0;transform:translateY(40px) scale(1.06)}100%{opacity:1;transform:none}}
@keyframes t-launch-out{to{opacity:0;transform:scale(.88) translateY(30px)}}
@keyframes t-data-in{0%{clip-path:inset(0 100% 0 0);opacity:.2}100%{clip-path:inset(0);opacity:1}}
.fx{position:absolute;inset:0;z-index:7;pointer-events:none}
.fx.zoom,.fx.rdv{background:radial-gradient(circle at center,rgba(220,250,255,.9),rgba(70,224,255,.25) 35%,transparent 65%);animation:fxflash 1100ms ease-in-out both}
.fx.eng{background:repeating-linear-gradient(90deg,rgba(70,224,255,.22) 0 1px,transparent 1px 40px),repeating-linear-gradient(0deg,rgba(70,224,255,.22) 0 1px,transparent 1px 40px);animation:fxgrid 900ms ease-in-out both}
.fx.launch::before,.fx.launch::after{content:"";position:absolute;left:0;right:0;height:90px;background:#000;animation:letter 1000ms ease-in-out both}
.fx.launch::before{top:0}.fx.launch::after{bottom:0}
.fx.data{background:linear-gradient(90deg,transparent,rgba(70,224,255,.5),transparent);width:30%;animation:fxsweep 900ms ease-in-out both}
@keyframes fxflash{0%{opacity:0}35%{opacity:1}100%{opacity:0}}
@keyframes fxgrid{0%{opacity:0}40%{opacity:1}100%{opacity:0}}
@keyframes letter{0%,100%{transform:scaleY(0)}40%,70%{transform:scaleY(1)}}
.fx.launch::before{transform-origin:top}.fx.launch::after{transform-origin:bottom}
@keyframes fxsweep{from{transform:translateX(-100%)}to{transform:translateX(400%)}}

/* panel / card */
.panel{position:relative;border:1px solid var(--line);border-radius:3px;background:linear-gradient(180deg,rgba(16,28,48,.84),rgba(8,15,27,.9));padding:16px}
.panel::before,.panel::after{content:"";position:absolute;width:12px;height:12px;pointer-events:none;border:0 solid var(--cyan);opacity:.8}
.panel::before{left:-1px;top:-1px;border-left-width:2px;border-top-width:2px}
.panel::after{right:-1px;bottom:-1px;border-right-width:2px;border-bottom-width:2px}
.panel.warn{border-color:var(--amber)}.panel.crit{border-color:var(--red)}
.panel.warn::before,.panel.warn::after{border-color:var(--amber)}
.panel.crit::before,.panel.crit::after{border-color:var(--red)}
.card{border:1px solid var(--line);background:rgba(11,20,34,.82);border-radius:3px;padding:12px 14px;text-align:left;cursor:pointer;transition:transform var(--ui) var(--ease),border-color var(--micro),box-shadow var(--ui),opacity var(--ui);min-height:44px;display:block;width:100%}
.card:hover{border-color:var(--cyan2);transform:translateY(-2px)}
.card.sel{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 24px rgba(70,224,255,.28) inset}
.card.locked{opacity:.4;cursor:not-allowed}
.card h3{font:600 15px var(--f-d);letter-spacing:.05em}
.card p{color:var(--mute);font-size:12.5px;margin-top:3px}
.card .meta{font:500 11px var(--f-m);color:var(--cyan);margin-top:6px;display:flex;gap:12px;flex-wrap:wrap}

/* buttons */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;min-width:48px;padding:0 24px;border:1px solid var(--line2);background:rgba(11,20,34,.85);font:600 14px var(--f-d);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;border-radius:3px;transition:transform var(--micro) var(--ease),background var(--micro),border-color var(--micro),opacity var(--micro)}
.btn:hover{transform:scale(1.03);border-color:var(--cyan)}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--cyan);color:#021018;border-color:var(--cyan);border-radius:0;clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%)}
.btn.primary:hover{background:#7aebff}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.danger:hover{background:rgba(255,74,90,.14)}
.btn.icon{padding:0;width:48px}
.btn.sm{min-height:44px;padding:0 16px;font-size:12px}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn.loading{pointer-events:none;opacity:.85}
.btn.loading::after{content:"";width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.btn.success{background:var(--green);border-color:var(--green);color:#021810}
.btn.critical{background:var(--red);border-color:var(--red);color:#1a0206;animation:hudpulse .5s infinite alternate}
:focus-visible{outline:2px solid #fff;outline-offset:3px}

/* meters */
.meter{display:flex;flex-direction:column;gap:5px;min-width:0}
.meter .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meter .val{font:600 15px var(--f-m)}
.meter .bar{position:relative;height:9px;background:#10223a;border-radius:1px;overflow:hidden}
.meter .fill{position:absolute;left:0;top:0;bottom:0;background:var(--cyan);transition:width var(--ui) var(--ease),background var(--ui)}
.meter.warn .fill{background:var(--amber)}.meter.crit .fill{background:var(--red);animation:hudpulse .5s infinite alternate}
.meter.warn .val{color:var(--amber)}.meter.crit .val{color:var(--red)}
.meter.big .bar{height:14px}
.meter .mk{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fff;opacity:.7}

/* slider */
.sl{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;cursor:pointer;--c:var(--cyan2)}
.sl.med{--c:var(--cyan)}.sl.high{--c:var(--amber)}.sl.drag{--c:#9af0ff}
.sl::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--c) var(--p),#16273e var(--p))}
.sl::-moz-range-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--c) var(--p),#16273e var(--p))}
.sl::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--ink);border:3px solid var(--c);margin-top:-8px;box-shadow:0 0 12px var(--c);transition:transform var(--micro)}
.sl::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--ink);border:3px solid var(--c)}
.sl.drag::-webkit-slider-thumb{transform:scale(1.25)}
.sl:disabled{opacity:.35}

/* misc controls */
.chk{width:28px;height:28px;border:2px solid var(--line2);border-radius:3px;display:grid;place-items:center;flex:none;transition:all var(--micro);color:transparent}
.chk svg{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset var(--ui) var(--ease)}
.chk.on{background:var(--green);border-color:var(--green);color:#021810}
.chk.on svg{stroke-dashoffset:0}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{min-height:44px;padding:0 14px;border:1px solid var(--line);background:transparent;border-radius:3px;font:600 12px var(--f-d);letter-spacing:.1em;cursor:pointer;color:var(--mute);transition:all var(--micro)}
.tab[aria-selected=true]{background:var(--cyan);color:#021018;border-color:var(--cyan)}
.pill{display:inline-block;padding:2px 9px;border:1px solid currentColor;border-radius:99px;font:600 10px var(--f-m);letter-spacing:.14em}
.acc{border:1px solid var(--line);border-radius:3px;background:rgba(11,20,34,.7)}
.acc button.hd{width:100%;min-height:48px;display:flex;justify-content:space-between;align-items:center;padding:0 14px;background:none;border:0;cursor:pointer;font:600 13px var(--f-d);letter-spacing:.1em}
.acc .bd{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--ui) var(--ease)}
.acc.open .bd{grid-template-rows:1fr}
.acc .bd>div{overflow:hidden}
.acc .bd p{padding:0 14px 12px;color:var(--mute);font-size:13px}
.acc .chev{transition:transform var(--ui)}.acc.open .chev{transform:rotate(90deg)}
.obj{display:flex;gap:12px;align-items:center;min-height:52px;padding:8px 12px;border:1px solid var(--line);background:rgba(11,20,34,.7);border-radius:3px;width:100%;text-align:left;cursor:pointer}
.obj .t{font:600 14px var(--f-d);letter-spacing:.04em}
.obj .s{font-size:12px;color:var(--mute)}
.obj.active{border-color:var(--cyan)}.obj.completed{border-color:var(--green)}.obj.failed{border-color:var(--red)}
.state{font:600 10px var(--f-m);letter-spacing:.16em}
.banner{padding:10px 14px;border:1px solid var(--amber);background:rgba(255,178,62,.1);color:var(--amber);font:600 12px var(--f-m);letter-spacing:.1em;border-radius:3px}
.banner.bad{border-color:var(--red);background:rgba(255,74,90,.12);color:var(--red)}
.banner.ok{border-color:var(--green);background:rgba(92,242,176,.1);color:var(--green)}
.tele{border:1px solid var(--line);background:rgba(11,20,34,.8);border-radius:3px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tele .v{font:600 22px var(--f-m)}
.tele.Warning{border-color:var(--amber)}.tele.Warning .v{color:var(--amber)}
.tele.Critical{border-color:var(--red)}.tele.Critical .v{color:var(--red);animation:flick 1.4s linear infinite}
.tele.Offline{opacity:.4}
.modal{position:absolute;inset:0;z-index:3;display:grid;place-items:center;background:rgba(2,5,10,.6)}
.big-num{font:700 64px/1 var(--f-d);letter-spacing:.02em}
.stamp{font:700 44px var(--f-d);letter-spacing:.16em;animation:pop 700ms var(--ease) both}
.kbd{font:600 11px var(--f-m);border:1px solid var(--line2);border-radius:3px;padding:2px 6px;color:var(--ink)}
.input{height:48px;width:100%;background:rgba(11,20,34,.9);border:1px solid var(--line2);border-radius:3px;padding:0 14px 0 42px;font:500 15px var(--f-m);outline-offset:2px}

/* page specific */
.p1-ship{position:absolute;right:30px;top:120px;width:640px;animation:float 6s ease-in-out infinite}
.p1-copy{position:absolute;left:64px;top:170px;width:560px;display:flex;flex-direction:column;gap:18px}
.title{font:700 84px/.92 var(--f-d);letter-spacing:.04em;text-transform:uppercase}
.title span{display:block;color:var(--cyan);text-shadow:0 0 40px rgba(70,224,255,.55);letter-spacing:.1em;font-size:92px}
.tagline{font:600 15px var(--f-m);letter-spacing:.32em;color:var(--mute)}

const findP=(k,id)=>PARTS[k].find(p=>p.id===id);
function calcDesign(d){
  const P=findP('prop',d.prop),St=findP('struct',d.struct),Pw=findP('power',d.power),Sh=findP('shield',d.shield),Cm=findP('comms',d.comms);
  const ins=d.instr.map(id=>findP('instr',id));
  const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
  const dry=BUS.mass+P.mass+St.mass+Pw.mass+Sh.mass+Cm.mass+sum(ins,i=>i.mass);
  const wet=dry+d.load;
  const cost=BUS.cost+P.cost+St.cost+Pw.cost+Sh.cost+Cm.cost+sum(ins,i=>i.cost);
  const dv=P.isp*9.81*Math.log(wet/dry);
  const sci=sum(ins,i=>i.sci);
  return {dry,wet,cost,dv,sci,P,St,Pw,Sh,Cm,ins,
    structPct:wet/(St.str*45)*100,
    thermalPct:40+sci*.45+P.heat+Pw.heat,
    vibPct:P.vib*(wet/2400)};
}
const designPatch=(s,d)=>{const c=calcDesign(d);return {design:d,mass:Math.round(c.wet),deltaV:Math.round(c.dv),dvMax:Math.round(c.dv),fuel:100,budget:Math.round((LIM.budget-c.cost)*1e6)}};

const PH={1:'STANDBY',2:'STANDBY',3:'BRIEFING',4:'PLANNING',5:'DESIGN',6:'STRESS TEST',7:'LAUNCH',8:'CRUISE',9:'CRUISE',10:'ANOMALY',11:'APPROACH',12:'RENDEZVOUS',13:'SCIENCE',14:'DATA',15:'POWER',16:'COMMS',17:'CRISIS',18:'RECOVERY',19:'DEBRIEF',20:'ARCHIVE'};
const modeMult=m=>({CADET:.75,COMMANDER:1,VETERAN:1.3}[m]||1);
const dmgMult=s=>(1.25-s.priorities.safety/100*.9)*modeMult(s.mode);
const sciYield=s=>clamp(s.power.science/30,.4,1.8);
const thermalLoad=s=>{const p=s.power;const heat=p.science*.9+p.computing*.6+p.comms*.5;const cool=p.thermal*1.6;const base=s.stress?s.stress.thermal:60;return clamp(35+(heat-cool)*.9+(base-60)*.4+s.heatSpike,0,120)};
const signalQ=s=>clamp(.30+s.power.comms/100*1.1+(findP('comms',s.design.comms).gain-1)*.25+(s.repoint>0?.12:0)-.05,.12,.97);
const lvl=(v,w,c,inv)=>inv?(v<=c?'crit':v<=w?'warn':''):(v>=c?'crit':v>=w?'warn':'');
const L=(s,text)=>({...s.eventState,causalLog:[...s.eventState.causalLog,{met:s.met,text}]});
const hurt=(s,a)=>clamp(s.health-a*dmgMult(s),0,100);
const dvPatch=(s,amt)=>{const nd=Math.max(0,s.deltaV-amt);const c=calcDesign(s.design);return {deltaV:nd,fuel:Math.round(nd/Math.max(1,s.dvMax)*1000)/10,mass:Math.round(c.dry+(c.wet-c.dry)*nd/Math.max(1,s.dvMax))}};

const EVENTS={

/* per-tick simulation (dt seconds) */
function tick(s,dt){
  const p=s.page,o={};
  if(p>=8&&p<=17&&s.outcome!=='failure'){
    o.met=s.met+dt*(p<=10?3600*s.warp:700);
    const tl=thermalLoad(s);
    if(tl>80)o.health=clamp((o.health??s.health)-(tl>92?1.5:.6)*dt*dmgMult(s),0,100);
  }
  if(p>=8&&p<=10&&s.cruise<100)o.cruise=Math.min(100,s.cruise+dt*1.2*findP('prop',s.design.prop).thrust*s.warp);
  if(s.heatSpike>0)o.heatSpike=Math.max(0,s.heatSpike-dt*3);
  if(s.repoint>0)o.repoint=Math.max(0,s.repoint-dt);
  if(s.repointCd>0)o.repointCd=Math.max(0,s.repointCd-dt);
  if(p===11&&s.range>60)o.range=Math.max(60,s.range-s.vel*.9*dt);
  if(p===17&&!s.crisisPick){o.crisisLeft=Math.max(0,s.crisisLeft-dt);o.health=clamp((o.health??s.health)-.3*dt*dmgMult(s),0,100)}
  const cd=s.cd;let any=false;const nc={};for(const k in cd){if(cd[k]>0){nc[k]=Math.max(0,cd[k]-dt);any=true}}
  if(any)o.cd=nc;
  return o;
}

/* score */
function finalScore(s){
  const w=k=>s.priorities[k]/33.3;
  const sci=s.banked*6*w('science');
  const surv=(s.health*5+(s.docked==='success'?150:0))*w('safety');
  const eco=((s.budget/1e6)*25+(s.deltaV/Math.max(1,s.dvMax))*300)*w('economy');
  const total=s.outcome==='failure'?Math.round((sci+eco)*.3):Math.round(sci+surv+eco);
  const grade=s.outcome==='failure'?'F':total>=2000?'S':total>=1500?'A':total>=1000?'B':total>=500?'C':'D';
  const verdict=s.outcome==='failure'?'MISSION LOST':s.banked>=60?'MISSION SUCCESS':'PARTIAL SUCCESS';
  return {sci:Math.round(sci),surv:Math.round(surv),eco:Math.round(eco),total,grade,verdict};
}

const Num=({v,d=0,suffix='',cls='',dur=420,start})=>{
  const [x,setX]=useState(start!=null?start:v);
  const from=useRef(start!=null?start:v);const raf=useRef(0);
  useEffect(()=>{
    if(RM){setX(v);from.current=v;return}
    const a=from.current,b=v,t0=performance.now();
    cancelAnimationFrame(raf.current);
    const f=now=>{const t=clamp((now-t0)/dur,0,1);const e=1-Math.pow(1-t,3);const val=a+(b-a)*e;from.current=val;setX(val);if(t<1)raf.current=requestAnimationFrame(f)};
    raf.current=requestAnimationFrame(f);
    return()=>cancelAnimationFrame(raf.current);
  },[v]);
  return html`<span className=${'num '+cls}>${fmt(x,d)}${suffix}</span>`;
};

/* ---------- starfield (one canvas, reused everywhere) ---------- */
const WARP={v:1,t:1};
function Starfield({sc}){
  const cv=useRef();
  useEffect(()=>{
    const c=cv.current,ctx=c.getContext('2d');
    const pr=clamp(sc*(window.devicePixelRatio||1),1,2);
    c.width=1280*pr;c.height=720*pr;ctx.setTransform(pr,0,0,pr,0,0);
    const mk=(near)=>{const a=Math.random()*6.283,r=near?rnd(20,120):Math.sqrt(Math.random())*760;return {x:640+Math.cos(a)*r,y:360+Math.sin(a)*r*.56,d:rnd(.2,1),px:0,py:0}};
    const stars=Array.from({length:RM?90:150},()=>mk(false));
    let raf,last=performance.now();
    const draw=now=>{
      const dt=Math.min(.05,(now-last)/1000);last=now;
      WARP.v=lerp(WARP.v,WARP.t,Math.min(1,dt*3));
      ctx.clearRect(0,0,1280,720);
      const w=WARP.v-1;
      for(const s of stars){
        s.px=s.x;s.py=s.y;
        if(!RM){
          s.x-=s.d*9*dt;
          if(w>.05){s.x=640+(s.x-640)*(1+dt*w*.9);s.y=360+(s.y-360)*(1+dt*w*.9)}
        }
        if(s.x<-10||s.x>1290||s.y<-10||s.y>730){if(w>.5){Object.assign(s,mk(true));s.px=s.x;s.py=s.y}else{s.x=1285;s.y=rnd(0,720);s.px=s.x;s.py=s.y}}
        ctx.strokeStyle=`rgba(190,235,255,${.25+s.d*.65})`;ctx.lineWidth=.6+s.d*1.1;
        ctx.beginPath();ctx.moveTo(w>.5?s.px:s.x,w>.5?s.py:s.y);ctx.lineTo(s.x+.01,s.y);ctx.stroke();
      }
      if(!RM&&!document.hidden)raf=requestAnimationFrame(draw);else if(!RM)raf=requestAnimationFrame(draw);
    };
    raf=requestAnimationFrame(draw);
    return()=>cancelAnimationFrame(raf);
  },[Math.round(sc*4)]);
  return html`<canvas ref=${cv} className="stars" aria-hidden="true"></canvas>`;
}

/* sequence helper: run staged timeouts, cleaned on unmount */
function useTimers(){
  const t=useRef([]);
  useEffect(()=>()=>t.current.forEach(clearTimeout),[]);
  return useCallback((fn,ms)=>{const id=setTimeout(fn,ms);t.current.push(id);return id},[]);
}

    const f=now=>{
      if(now-last>66&&!RM){last=now;const v=getv();for(let i=0;i<4;i++){ch[i].push(clamp(v[i]+rnd(-.04,.04),0,1));ch[i].shift()}}
      x.clearRect(0,0,760,420);

        x.strokeStyle='rgba(255,178,62,.5)';x.setLineDash([5,5]);x.beginPath();x.moveTo(ox,oy+h*.2);x.lineTo(ox+w,oy+h*.2);x.stroke();x.setLineDash([]);
        x.fillStyle='#8da6c2';x.font='600 10px JetBrains Mono, monospace';x.fillText(names[i],ox+10,oy+16);

      </div>

        <span className=${'pill '+(res.hp<0?'bad':'good')}>HEALTH ${res.hp<0?res.hp:'±0'}%</span>

        ${res.nav!==0&&html`<span className=${'pill '+(res.nav>0?'good':'warnc')}>NAV ${res.nav>0?'+':''}${res.nav}%</span>`}

      <span className="mono dim" style=${{fontSize:12}}>${pick==null?'CHOOSE A RESPONSE':ready?'APPROACH WINDOW OPEN':`APPROACH WINDOW IN ${Math.ceil((100-S.cruise)/(1.2*S.warp))}s`}</span>
      <div className="row gap">

/* 12 RENDEZVOUS — docking mini-game */
function P12(){
  const {S,up,go}=useG();const cv=useRef();const sim=useRef(null);const keys=useRef({});
  const [ph,setPh]=useState('idle');const [hud,setHud]=useState({z:100,vz:0,off:0,vl:0});const [tries,setTries]=useState(0);const t=useTimers();
  const reset=()=>{
    const spread=(100-S.nav)*1.1+25;
    sim.current={x:rnd(-spread,spread),y:rnd(-spread,spread)*.7,vx:rnd(-.5,.5),vy:rnd(-.5,.5),z:100,vz:Math.max(1,S.vel/12),pulses:0,state:'run',tx:0};
  };
  const pulse=(dx,dy,dz)=>{const m=sim.current;if(!m||m.state!=='run')return;if(S.deltaV-m.pulses*1.5<1.5)return;m.pulses++;m.vx+=dx*.35;m.vy+=dy*.35;m.vz=Math.max(.2,m.vz+dz*.35)};
  const begin=()=>{reset();setPh('run')};
  const finish=(ok)=>{
    const m=sim.current;m.state=ok?'ok':'bad';
    const dv=m.pulses*1.5;
    if(ok){setPh('ok');up(s=>({...dvPatch(s,dv),docked:'success',eventState:{...L(s,'Docked with ASTERIA-1 after '+m.pulses+' RCS pulses.'),decisionHistory:[...s.eventState.decisionHistory,{page:12,label:'Rendezvous',choice:'Manual docking',effect:'docked, '+m.pulses+' pulses'}]}}))}
    else{setPh('bad');setTries(n=>n+1);up(s=>({...dvPatch(s,dv),health:hurt(s,12),eventState:L(s,'Docking failed at '+(m.vz).toFixed(1)+' m/s closing speed.')}))}
  };
  useEffect(()=>{
    const kd=e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' ','b','f'].includes(k)){e.preventDefault();
      if(e.repeat)return;
      if(k==='arrowleft')pulse(-1,0,0);if(k==='arrowright')pulse(1,0,0);if(k==='arrowup')pulse(0,-1,0);if(k==='arrowdown')pulse(0,1,0);if(k===' '||k==='b')pulse(0,0,-1);if(k==='f')pulse(0,0,1)}};
    window.addEventListener('keydown',kd);return()=>window.removeEventListener('keydown',kd);
  },[S.deltaV]);
  useEffect(()=>{
    const c=cv.current,x=c.getContext('2d');let raf,last=performance.now(),acc=0;
    const f=now=>{
      const dt=Math.min(.05,(now-last)/1000);last=now;const m=sim.current;
      x.clearRect(0,0,600,420);
      x.strokeStyle='rgba(70,224,255,.12)';for(let i=0;i<=12;i++){x.beginPath();x.moveTo(i*50,0);x.lineTo(i*50,420);x.stroke()}for(let i=0;i<=8;i++){x.beginPath();x.moveTo(0,i*52.5);x.lineTo(600,i*52.5);x.stroke()}
      const cx=300,cy=210;
      if(m){
        if(m.state==='run'){m.x+=m.vx*dt*14;m.y+=m.vy*dt*14;m.z-=m.vz*dt;
          acc+=dt;if(acc>.1){acc=0;setHud({z:Math.max(0,m.z),vz:m.vz,off:Math.hypot(m.x,m.y),vl:Math.hypot(m.vx,m.vy)})}
          if(m.z<=0){const ok=Math.hypot(m.x,m.y)<=14&&m.vz<=2.5&&Math.hypot(m.vx,m.vy)<=.8;finish(ok)}}
        const k=clamp(1-m.z/100,0,1);const R=lerp(26,140,k*k);
        /* port */
        x.strokeStyle='#5cf2b0';x.lineWidth=2;x.beginPath();x.arc(cx,cy,R,0,6.283);x.stroke();x.strokeStyle='rgba(92,242,176,.35)';x.beginPath();x.arc(cx,cy,R*.55,0,6.283);x.stroke();
        for(let i=0;i<8;i++){const a=i*.785+performance.now()/6000;x.beginPath();x.moveTo(cx+Math.cos(a)*R*.9,cy+Math.sin(a)*R*.9);x.lineTo(cx+Math.cos(a)*R*1.1,cy+Math.sin(a)*R*1.1);x.stroke()}
        /* craft reticle */
        const px=cx+m.x*R/60,py=cy+m.y*R/60;
        const good=Math.hypot(m.x,m.y)<=14&&m.vz<=2.5&&Math.hypot(m.vx,m.vy)<=.8;
        x.strokeStyle=m.state==='bad'?'#ff4a5a':good?'#5cf2b0':'#46e0ff';x.lineWidth=2.5;
        x.beginPath();x.arc(px,py,12+R*.12,0,6.283);x.stroke();x.beginPath();x.moveTo(px-24-R*.1,py);x.lineTo(px-8,py);x.moveTo(px+8,py);x.lineTo(px+24+R*.1,py);x.moveTo(px,py-24-R*.1);x.lineTo(px,py-8);x.moveTo(px,py+8);x.lineTo(px,py+24+R*.1);x.stroke();
        x.strokeStyle='rgba(70,224,255,.4)';x.setLineDash([4,6]);x.beginPath();x.moveTo(cx,cy);x.lineTo(px,py);x.stroke();x.setLineDash([]);
        if(m.state==='ok'){m.tx+=dt;const r=lerp(220,30,Math.min(1,m.tx*1.4));x.strokeStyle=`rgba(92,242,176,${1-Math.min(1,m.tx*.8)*.5})`;x.lineWidth=6;x.beginPath();x.arc(cx,cy,r,0,6.283);x.stroke()}
        if(m.state==='bad'){m.tx+=dt;x.strokeStyle='#ff4a5a';x.lineWidth=2;for(let i=0;i<14;i++){const a=i*.45,d=m.tx*180+i*4;x.beginPath();x.moveTo(px+Math.cos(a)*d*.4,py+Math.sin(a)*d*.4);x.lineTo(px+Math.cos(a)*d,py+Math.sin(a)*d);x.stroke()}}
      }
      raf=requestAnimationFrame(f);
    };
    raf=requestAnimationFrame(f);return()=>cancelAnimationFrame(raf);
  },[]);
  const stab=hud.vz<=2.5&&hud.vl<=.8;
  const dp=[[0,0,'',''],[0,-1,'up','chev'],[0,0,'','']];
  const retry=()=>{if(S.deltaV>=60){up(s=>({...dvPatch(s,60),eventState:L(s,'Retry approach cost 60 m/s of ΔV.')}));begin()}};
  const abort=()=>{up(s=>({docked:'abort',eventState:{...L(s,'Docking aborted. Mission continues as a flyby with halved science.'),decisionHistory:[...s.eventState.decisionHistory,{page:12,label:'Rendezvous',choice:'Abort to flyby',effect:'science ×0.5'}]}}));go(13)};
  return html`<section className="page" aria-label="Rendezvous">
    <${PHead} n=${12} title="RENDEZVOUS" sub="Line up the reticle on the docking port. Touch down slow and centered." right=${html`<div className="mono dim" style=${{fontSize:12}}>KEYS <span className="kbd">←↑↓→</span> lateral · <span className="kbd">SPACE</span> brake · <span className="kbd">F</span> forward</div>`}/>
    <div className="row gap20 grow" style=${{alignItems:'stretch'}}>
      <div className=${'panel craftbox '+(ph==='bad'?'shake':'')} style=${{width:624,padding:12,background:ph==='bad'?'rgba(60,8,14,.8)':undefined}}><canvas ref=${cv} width="600" height="420" style=${{width:600,height:420}} role="img" aria-label="Docking view"></canvas>
        ${ph==='ok'&&html`<div className="stamp good" style=${{position:'absolute',fontSize:36}}>DOCKED</div>`}
        ${ph==='bad'&&html`<div className="stamp bad glitchy" style=${{position:'absolute',fontSize:34}}>DOCKING FAILED</div>`}
      </div>
      <div className="col gap grow">
        <div className="panel col gap rise" style=${ri(1)}>
          <div className="row between"><span className="lab">Distance to port</span><b className="mono" style=${{fontSize:24}}>${hud.z.toFixed(1)} m</b></div>
          <${Meter} label="Closing speed" v=${hud.vz} max=${8} d=${2} unit=" m/s" warn=${2.5} crit=${5} mark=${2.5}/>
          <${Meter} label="Lateral drift" v=${hud.vl} max=${3} d=${2} unit=" m/s" warn=${.8} crit=${1.8} mark=${.8}/>
          <${Meter} label="Offset" v=${hud.off} max=${90} d=${0} unit=" m" warn=${14} crit=${35} mark=${14}/>
          <div className=${'banner '+(stab?'ok':'')}>${stab?'VELOCITY STABILIZED':'STABILIZE VELOCITY'}</div>
        </div>
        <div className="row gap20 rise" style=${ri(2)}>
          <div className="dpad" role="group" aria-label="Thruster controls">
            <span></span><${Btn} k="secondary" icon="chev" title="Thrust up" onClick=${()=>pulse(0,-1,0)} cls="up"/><span></span>
            <${Btn} k="secondary" icon="back" title="Thrust left" onClick=${()=>pulse(-1,0,0)}/><${Btn} k="secondary" icon="x" title="Brake" onClick=${()=>pulse(0,0,-1)}/><${Btn} k="secondary" icon="chev" title="Thrust right" onClick=${()=>pulse(1,0,0)}/>
            <span></span><${Btn} k="secondary" icon="chev" title="Thrust down" onClick=${()=>pulse(0,1,0)} cls="down"/><span></span>
          </div>
          <div className="col gap8 grow"><${Btn} k="secondary" sm onClick=${()=>pulse(0,0,-1)}>Brake · −0.35<//><${Btn} k="secondary" sm onClick=${()=>pulse(0,0,1)}>Forward · +0.35<//>
            <div className="mono dim" style=${{fontSize:11}}>Each pulse costs 1.5 m/s of ΔV · ${fmt(S.deltaV)} left</div></div>
        </div>
      </div>
    </div>
    <div className="row between rise" style=${ri(3)}>
      <span className="mono dim" style=${{fontSize:12}}>${ph==='idle'?'READY FOR FINAL APPROACH':ph==='run'?'DOCKING IN PROGRESS':''}</span>
      <div className="row gap">
        ${ph==='idle'&&html`<${Btn} glow icon="play" onClick=${begin}>Begin final approach<//>`}
        ${ph==='ok'&&html`<${Btn} glow icon="chev" onClick=${()=>go(13)}>Begin science<//>`}
        ${ph==='bad'&&html`<${Btn} k="secondary" icon="skip" onClick=${abort}>Abort · flyby science<//>`}
        ${ph==='bad'&&html`<${Btn} icon="refresh" disabled=${S.deltaV<60} onClick=${retry}>Retry · −60 ΔV<//>`}
      </div>
    </div>
  </section>`;

/* 13 SCIENCE */

  const {S,up,go}=useG();const [beam,setBeam]=useState(null);const t=useTimers();
  const ins=S.design.instr.map(id=>findP('instr',id));const yld=sciYield(S);const mult=S.docked==='success'?1:.5;

            <${Btn} sm k=${off?'secondary':'primary'} disabled=${off||cdv>0||!!beam} icon=${lockd?'lock':'scan'} onClick=${()=>scan(i)}>${lockd?'Locked':n>=3?'Done':cdv>0?cdv.toFixed(0)+'s':beam===i.id?'Scanning':'Scan'}<//></div>`})}</div>

/* 14 DATA MANAGEMENT */
function P14(){
  const {S,up,go}=useG();const [busy,setBusy]=useState(false);const [stage,setStage]=useState(Math.round(S.dataQueue));const t=useTimers();
  const maxS=Math.floor(S.dataQueue);
  useEffect(()=>setStage(s=>Math.min(s,Math.floor(S.dataQueue))),[S.dataQueue]);
  const compress=(lossy)=>{
    if(busy||S.dataQueue<=0)return;setBusy(lossy?'lossy':'ll');
    t(()=>{
      up(s=>{const comp=s.power.computing;const ratio=lossy?clamp(.35+comp*.006,.3,.6):(.10+comp*.004)*Math.pow(.6,s.compCount);
        const nd=s.dataQueue*(1-ratio);const nv=lossy?s.queueValue*.8:s.queueValue;
        return {dataQueue:nd,queueValue:nv,compCount:lossy?s.compCount:s.compCount+1,eventState:L(s,`${lossy?'Lossy':'Lossless'} compression cut the queue by ${Math.round(ratio*100)}%${lossy?' and discarded 20% of its science value':''}.`)}});
      setBusy(false);
    },RM?0:1500);
  };
  const stageNow=()=>{
    if(stage<=0)return;
    up(s=>{const amt=Math.min(stage,s.dataQueue),f=s.dataQueue>0?amt/s.dataQueue:0;return {dataQueue:s.dataQueue-amt,queueValue:s.queueValue*(1-f),txBuffer:s.txBuffer+amt,txValue:s.txValue+s.queueValue*f,eventState:L(s,`Staged ${amt.toFixed(1)} GB for uplink.`)}});
  };
  const fill=S.dataQueue/S.maxDataStorage;
  const packets=Math.min(14,Math.ceil(S.dataQueue/2.4));

/* 15 POWER */

        </svg>

          ${rows.map(([k,n,ic,eff])=>html`<div key=${k}><div className="row between"><span className="row gap8"><span className="cy"><${Ic} n=${ic} s=${16}/></span><span className="lab">${n}</span></span><span className="mono dim" style=${{fontSize:11}}>${eff}</span></div>

          ${tl>80?html`<div className="banner bad">OVERHEATING · HULL DAMAGE IN PROGRESS</div>`:tl>65?html`<div className="banner">THERMAL MARGIN LOW</div>`:html`<div className="banner ok">THERMAL NOMINAL</div>`}

/* 16 COMMUNICATION */

/* 17 CRISIS */
function P17(){
  const {S,up,go}=useG();const pick=S.crisisPick;const tl=thermalLoad(S);const done=useRef(false);
  const base=20+Math.max(0,tl-55)*1.2;const comp=S.power.computing;
  const OPTS=[
    {k:'Reroute coolant through the computing bus',sub:'Works better with more computing power. Shifts +20 to thermal.',calc:()=>({dmg:base*.5/clamp(comp/25,.4,1.2),power:{thermal:20,science:-20},txt:'Coolant reroute'})},
    {k:'Enter safe mode',sub:'Steady, never perfect. Loses 30% of the uplink buffer.',calc:()=>({dmg:base*.6+5,lose:.3,txt:'Safe mode'})},
    {k:'Vent coolant and bypass the loop',sub:comp>=20?'Computing power is high enough to run the bypass.':'Computing under 20%. This is likely to go badly.',calc:()=>({dmg:comp>=20?base*.2:base*1.5,txt:'Vent and bypass'})}];
  const resolve=(i)=>{
    if(done.current)return;done.current=true;
    const o=i==null?{calc:()=>({dmg:base*1.6,txt:'No action taken'}),k:'No decision'}:OPTS[i];const r=o.calc();
    up(s=>{const dm=r.dmg;const h=hurt(s,dm);const o2={crisisPick:i==null?-1:i,crisisDmg:Math.round((s.health-h)*10)/10,health:h,
      eventState:{...L(s,`Crisis: ${r.txt} cost ${Math.round(s.health-h)}% health.`),decisionHistory:[...s.eventState.decisionHistory,{page:17,label:'Coolant loop failure',choice:o.k,effect:`−${Math.round(s.health-h)}% health`}]}};
      if(r.power){const q={...s.power};for(const k in r.power)q[k]=clamp(q[k]+r.power[k],5,70);const sum=Object.values(q).reduce((a,b)=>a+b,0);if(sum!==100)q.computing-=(sum-100);o2.power=q}
      if(r.lose){o2.txBuffer=s.txBuffer*(1-r.lose);o2.txValue=s.txValue*(1-r.lose)}
      return o2});
  };
  useEffect(()=>{if(S.crisisLeft<=0&&S.crisisPick==null)resolve(null)},[S.crisisLeft]);
  const rem=Math.ceil(S.crisisLeft);
  return html`<section className=${'page '+(pick==null?'':'')} aria-label="Crisis">
    <${PHead} n=${17} title="CRISIS" sub="Radiator coolant loop failure. Heat is building and the bus is degrading." right=${pick==null?html`<div className="col" style=${{alignItems:'flex-end'}}><div className="alarm">DECIDE NOW</div><div className="big-num bad" style=${{fontSize:64}}>${pad(rem)}</div></div>`:null}/>
    <div className="row gap20 grow" style=${{alignItems:'stretch'}}>
      <div className="panel crit col gap rise" style=${{...ri(1),width:420}}>
        <div className="alarm">⚠ EMERGENCY PANEL</div>
        <div className=${pick==null?'flick':''}><${Meter} label="Hull health" v=${S.health} unit="%" d=${0} warn=${50} crit=${25} inv=${true} big=${true}/></div>
        <div className=${pick==null?'flick':''}><${Meter} label="Thermal load" v=${tl+(pick==null?(20-S.crisisLeft)*.8:0)} max=${120} unit="%" warn=${65} crit=${80} big=${true}/></div>
        <${Meter} label="Bus integrity" v=${Math.max(0,S.health-(pick==null?(20-S.crisisLeft)*.4:0))} unit="%" warn=${50} crit=${25} inv=${true}/>
        <div className="mono dim" style=${{fontSize:12}}>Severity base ${base.toFixed(0)}% · comp ${comp}% · thermal ${S.power.thermal}%</div>
      </div>
      <div className="col gap8 grow">
        ${OPTS.map((o,i)=>html`<button type="button" key=${i} className=${'card rise '+(pick===i?'sel':'')} style=${{...ri(2+i),opacity:pick!=null&&pick!==i?.3:1,minHeight:84}} disabled=${pick!=null} onClick=${()=>resolve(i)}>
          <div className="row between"><h3 style=${{fontSize:17}}>${String.fromCharCode(65+i)} · ${o.k}</h3>${pick===i&&html`<span className="cy"><${Ic} n="lock" s=${18}/></span>`}</div><p style=${{fontSize:14}}>${o.sub}</p></button>`)}
        ${pick!=null&&html`<div className=${'banner rise '+(S.health>0?'':'bad')} style=${{fontSize:13}}>${pick===-1?'TIME EXPIRED · WORST CASE APPLIED · ':''}${S.crisisDmg>0?`HULL DAMAGE −${S.crisisDmg}%`:'NO DAMAGE'} · HEALTH NOW ${Math.round(S.health)}%</div>`}
      </div>
    </div>
    <div className="row between rise" style=${ri(5)}><span className="mono dim" style=${{fontSize:12}}>${pick==null?'NO DECISION IN TIME MEANS THE WORST OUTCOME':''}</span>
      <${Btn} glow=${pick!=null} k=${pick!=null&&S.health<=0?'danger':'primary'} icon="chev" disabled=${pick==null} onClick=${()=>go(18)}>Assess damage<//></div>
  </section>`;
}

            ${S.eventState.causalLog.slice(0,shown).map((l,i)=>html`<div key=${i} className="row gap" style=${{animation:'rise .4s both',alignItems:'flex-start'}}><span className="mono cy" style=${{fontSize:11,flex:'none',width:64}}>T+${pad(Math.floor(l.met/3600))}h</span><span style=${{fontSize:13.5}}>${l.text}</span></div>`)}
          </div>
        </div>
        <div className="panel rise" style=${ri(4)}>
          <div className="lab" style=${{marginBottom:6}}>Decision tree</div>
          <svg viewBox="0 0 560 100" width="100%" role="img" aria-label="Decision tree">
            ${[{l:'Design',s:cp.split(' ')[0]},...D.map(d=>({l:d.label.split(' ').slice(0,2).join(' '),s:d.choice.slice(0,22)})),{l:'Outcome',s:sc.verdict.split(' ')[1]||sc.verdict}].map((n,i,a)=>{const step=520/Math.max(1,a.length-1),x=20+i*step;return html`<g key=${i}>${i>0&&html`<line x1=${x-step+34} y1="38" x2=${x-34} y2="38" stroke="#46e0ff" strokeWidth="1.5" strokeDasharray="4 3" className="flow"/>`}<circle cx=${x} cy="38" r="9" fill=${i===a.length-1?(S.outcome==='failure'?'#ff4a5a':'#5cf2b0'):'#46e0ff'} style=${{animation:`pop .5s ${i*.3}s both`}}/><text x=${x} y="64" textAnchor="middle" fill="#e8f2fc" fontSize="10" fontFamily="Chakra Petch" fontWeight="600">${n.l}</text><text x=${x} y="78" textAnchor="middle" fill="#8da6c2" fontSize="8.5" fontFamily="JetBrains Mono">${n.s}</text></g>`})}
          </svg>
        </div>
      </div>
    </div>
    <div className="row between rise" style=${ri(5)}><div className="row gap"><${Btn} k="secondary" icon="refresh" onClick=${retry}>Retry · new design<//><${Btn} k="secondary" icon="back" onClick=${restart}>Restart<//></div>
      <${Btn} glow icon="search" onClick=${()=>go(20)}>Data center<//></div>
  </section>`;
}

/* 20 NASA DATA (simulated) */

  {t:'ASTERIA-1',tag:'GAME OBJECT',b:'A fictional C-type asteroid invented for this game. Its size, spin and orbit are not measurements of any real body.',x:'Game model: 412 m diameter, 7.2 h spin, 0.06 albedo.'},
  {t:'Delta-V budget',tag:'CONCEPT',b:'Delta-V is the total change in velocity a spacecraft can make. The rocket equation links it to exhaust speed and the ratio of full to empty mass.',x:'Game model: ΔV = Isp × 9.81 × ln(wet mass ÷ dry mass).'},
  {t:'Electric propulsion',tag:'CONCEPT',b:'Ion and Hall thrusters accelerate charged propellant. They use little fuel but push gently, so trips take longer.',x:'Game model: Hall 520 s, Ion 700 s, chemical 310 s, with matching cruise speeds.'},
  {t:'Thermal control',tag:'CONCEPT',b:'Spacecraft must shed the heat their electronics and instruments make. Radiators and heat pipes move heat to space.',x:'Game model: thermal load rises with science, computing and comms power and falls with thermal power.'},
  {t:'Deep space communications',tag:'CONCEPT',b:'Distant probes talk to large ground antennas. Higher-gain dishes narrow the beam and raise the data rate, but need accurate pointing.',x:'Game model: signal quality from comms power, antenna gain and repointing.'},
  {t:'Rendezvous and docking',tag:'CONCEPT',b:'Meeting another body means matching its position and velocity. Small thruster pulses correct drift in each axis.',x:'Game model: lateral and closing speed tolerances of 0.8 and 2.5 m/s.'}];
function P20(){
  const {S,go,restart}=useG();const [q,setQ]=useState('');const [open,setOpen]=useState(0);const [ld,setLd]=useState(RM?100:0);const t=useTimers();
  useEffect(()=>{if(RM)return;let v=0;const iv=setInterval(()=>{v+=8;setLd(Math.min(100,v));if(v>=100)clearInterval(iv)},60);return()=>clearInterval(iv)},[]);
  const items=DB.filter(d=>(d.t+d.b+d.tag).toLowerCase().includes(q.toLowerCase()));
  return html`<section className="page" aria-label="Data center">
    <${PHead} n=${20} title="DATA CENTER" sub="Background on the ideas behind the game." right=${html`<div className="banner" style=${{fontSize:13}}>SIMULATED / GAME DATA</div>`}/>
    <div className="row gap20 grow" style=${{alignItems:'stretch',minHeight:0}}>
      <div className="col gap grow" style=${{minHeight:0}}>
        <div style=${{position:'relative'}} className="rise"><span style=${{position:'absolute',left:14,top:14,color:'var(--mute)'}}><${Ic} n="search" s=${20}/></span>
          <input id="dbq" className="input" value=${q} onChange=${e=>setQ(e.target.value)} placeholder="Search the database" aria-label="Search the database"/></div>
        ${ld<100?html`<${Meter} label="Loading database" v=${ld} unit="%"/>`:null}
        <div className="col gap8 scroll grow" style=${{minHeight:0}}>
          ${ld>=100&&items.map((d,i)=>html`<div key=${d.t} className=${'acc rise '+(open===d.t?'open':'')} style=${ri(i)}>
            <button type="button" className="hd" aria-expanded=${open===d.t} onClick=${()=>setOpen(open===d.t?null:d.t)}><span>${d.t.toUpperCase()} <span className="pill dim" style=${{marginLeft:8}}>${d.tag}</span></span><span className="chev"><${Ic} n="chev" s=${18}/></span></button>
            <div className="bd"><div><p>${d.b}</p><p className="cy mono" style=${{fontSize:12}}>${d.x}</p></div></div></div>`)}
          ${ld>=100&&items.length===0&&html`<div className="dim mono">No entries match “${q}”.</div>`}
        </div>
      </div>
      <div className="col gap" style=${{width:380}}>
        <div className="panel rise" style=${ri(2)}><div className="lab">Rocket equation (game model)</div>
          <svg viewBox="0 0 340 170" width="100%" role="img" aria-label="Delta-V versus mass ratio">
            <g stroke="#1f3856"><line x1="30" x2="330" y1="150" y2="150"/><line x1="30" x2="30" y1="10" y2="150"/></g>
            <path d=${Array.from({length:30},(_,i)=>{const r=1+i/29*2;return `${i?'L':'M'}${30+(r-1)/2*300},${150-Math.log(r)/Math.log(3)*130}`}).join(' ')} fill="none" stroke="#46e0ff" strokeWidth="2.5" pathLength="1" strokeDasharray="1" style=${{strokeDashoffset:1,animation:'drawline 1.8s var(--ease) forwards'}}/>
            <text x="180" y="166" fill="#8da6c2" fontSize="9" textAnchor="middle" fontFamily="JetBrains Mono">WET ÷ DRY MASS</text><text x="34" y="20" fill="#8da6c2" fontSize="9" fontFamily="JetBrains Mono">ΔV</text>
          </svg></div>
        <div className="panel col gap8 rise" style=${ri(3)}><div className="lab">Real-world sources</div>
          <div className="dim" style=${{fontSize:13}}>Nothing in this game is real NASA data. For actual missions and small-body data, visit:</div>
          <a href="https://ssd.jpl.nasa.gov/" target="_blank" rel="noopener" className="cy mono" style=${{fontSize:12}}>JPL Solar System Dynamics</a>
          <a href="https://science.nasa.gov/" target="_blank" rel="noopener" className="cy mono" style=${{fontSize:12}}>NASA Science</a></div>
      </div>
    </div>
    <div className="row between rise" style=${ri(4)}><${Btn} k="secondary" icon="back" onClick=${()=>go(19)}>Back to debrief<//>
      <${Btn} glow icon="refresh" onClick=${restart}>New mission<//></div>
  </section>`;
}
/* ============ APP SHELL: state, transitions, HUD, scaling ============ */
const PAGES={1:P1,2:P2,3:P3,4:P4,5:P5,6:P6,7:P7,8:P8,9:P9,10:P10,11:P11,12:P12,13:P13,14:P14,15:P15,16:P16,17:P17,18:P18,19:P19,20:P20};
const KIND={'1>3':'zoom','3>4':'slide','5>6':'eng','6>7':'launch','11>12':'rdv','18>19':'data'};
const DUR={zoom:1100,slide:600,eng:900,launch:1000,rdv:1100,data:900,fade:450};

function enter(s,p){
  const o={};
  if(p===11&&!s.apInit){o.apInit=true;o.range=1800;o.vel=90}
  if(p===17){o.crisisLeft=20;o.crisisPick=null}
  if(p>=3)o.timeline=[...s.timeline,{p,met:s.met,health:Math.round(s.health),fuel:Math.round(s.fuel),banked:Math.round(s.banked)}];
  return o;
}

const Hud=memo(function Hud({S,hc,setHc}){
  const h=S.health,fu=S.fuel;
  const clock=`${pad(Math.floor(S.met/3600))}:${pad(S.met/60%60)}:${pad(S.met%60)}`;
  return html`<header className=${'hud '+(S.page<3?'dim':'')}>
    <div><div className="h-mis">MISSION: LAST LIGHT</div><div className="h-ph">PHASE: <b>${PH[S.page]}</b></div></div>
    <div className="h-c" aria-label="Mission elapsed time">T+ ${clock}</div>
    <div className="h-r">
      <div className=${'stat '+lvl(h,50,25,true)}><small>HEALTH</small><span className="num"><${Num} v=${h} d=${0}/>%</span></div>
      <div className=${'stat '+lvl(fu,25,12,true)}><small>FUEL</small><span className="num"><${Num} v=${fu} d=${0}/>%</span></div>
      <div className=${'stat '+lvl(S.dataQueue+S.txBuffer,S.maxDataStorage*.75,S.maxDataStorage*.95)}><small>DATA</small><span className="num"><${Num} v=${S.dataQueue+S.txBuffer} d=${1}/> GB</span></div>
      <button type="button" className="hc-btn" aria-pressed=${hc} aria-label="High contrast" onClick=${()=>setHc(!hc)}>HC</button>
    </div>
  </header>`;
});

function App(){
  const [S,setS]=useState(()=>initState());
  const ref=useRef(S);ref.current=S;
  const [view,setView]=useState({cur:1,prev:null,kind:'fade'});
  const [hc,setHc]=useState(false);
  const [sc,setSc]=useState(1);
  const fit=useRef();
  useEffect(()=>{const el=fit.current;const f=()=>setSc(clamp(Math.min(el.clientWidth/1280,el.clientHeight/720),.2,1.5));f();const ro=new ResizeObserver(f);ro.observe(el);return()=>ro.disconnect()},[]);
  const up=useCallback(f=>setS(s=>({...s,...(typeof f==='function'?f(s):f)})),[]);
  const swap=useCallback((p,kind)=>{
    const prev=ref.current.page,dur=RM?40:DUR[kind];
    setView({cur:p,prev:prev===p?null:prev,kind});
    if(kind==='zoom'||kind==='rdv'){WARP.t=RM?1:18;setTimeout(()=>{WARP.t=1},dur*.8)}
    setTimeout(()=>setView(v=>v.cur===p?{...v,prev:null}:v),dur+40);
  },[]);
  const go=useCallback(p=>{
    const s=ref.current;if(p===s.page)return;
    swap(p,KIND[s.page+'>'+p]||'fade');
    setS(q=>({...q,...enter(q,p),page:p,prevPage:q.page}));
  },[]);
  const restart=useCallback(()=>{swap(1,'fade');setS(initState())},[]);
  const retry=useCallback(()=>{swap(5,'fade');setS({...initState(ref.current),page:5})},[]);
  useEffect(()=>{const id=setInterval(()=>{if(!document.hidden)up(s=>tick(s,.25))},250);return()=>clearInterval(id)},[]);
  useEffect(()=>{if(S.health<=0&&S.page>=7&&S.page<18&&S.page!==17)go(18)},[S.health,S.page]);
  const ctx=useMemo(()=>({S,up,go,restart,retry}),[S]);
  const el=(p,role)=>html`<div key=${'pg'+p} className=${'pg-wrap '+(role==='out'?'out-'+view.kind:view.prev!=null?'in-'+view.kind:'')}>${html`<${PAGES[p]}/>`}</div>`;
  const kids=[view.prev!=null&&el(view.prev,'out'),el(view.cur,'in')].filter(Boolean);
  const crit=S.page===17&&S.crisisPick==null;
  return html`<${Ctx.Provider} value=${ctx}>
    <div className="vp">
      <div className="fit" ref=${fit}>
        <div className="frame" style=${{width:1280*sc,height:720*sc}}>
          <div className=${'stage '+(hc?'hc':'')} style=${{transform:`scale(${sc})`}} role="application" aria-label="Mission: Last Light">
            <div className="bg"></div>
            <${Starfield} sc=${sc}/>
            <div className="layer">${kids}</div>
            ${crit&&html`<div className="crit-vignette"></div>`}
            <${Hud} S=${S} hc=${hc} setHc=${setHc}/>
            ${view.prev!=null&&html`<div key=${'fx'+view.cur} className=${'fx '+view.kind}></div>`}
            <div className="rail" aria-hidden="true">${Array.from({length:20}).map((_,i)=>html`<i key=${i} className=${i+1<S.page?'done':i+1===S.page?'cur':''}></i>`)}</div>
            <div className="scan-lines"></div>
          </div>
        </div>
      </div>
      <div className="rotate-hint">Rotate your device to landscape for the best view.</div>
    </div>
  <//>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
