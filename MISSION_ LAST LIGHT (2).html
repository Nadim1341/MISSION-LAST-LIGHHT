<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MISSION: LAST LIGHT</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#080B12;--tx:#F3F6FA;--t2:#AAB4C3;--cy:#00E5FF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(circle at 50% 30%,#14213a,#05070c);color:var(--tx);font-family:Inter,'IBM Plex Sans',system-ui,sans-serif;min-height:100vh}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.card{background:rgba(21,27,38,.9);backdrop-filter:blur(8px);border:1px solid #293342;border-radius:14px;padding:12px}
.btn{min-height:48px;border-radius:12px;font-weight:700;letter-spacing:.04em;width:100%;border:1px solid var(--cy);color:var(--cy);background:transparent;transition:transform .1s}
.btn.p{background:var(--cy);color:#001418;box-shadow:0 0 22px #00e5ff88}
.btn:active{transform:scale(.95)}.btn.off{opacity:.45}
.pill{background:#0D111Acc;border:1px solid #293342;border-radius:99px;padding:4px 10px;font-size:11px}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#101620f2;backdrop-filter:blur(12px);border-top:1px solid var(--cy);border-radius:22px 22px 0 0;padding:16px;z-index:30;animation:up .3s ease-out;max-height:88%;overflow:auto}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes bl{50%{opacity:.35}}
@keyframes zm{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes rk{from{transform:translateY(700px)}to{transform:translateY(-900px)}}
@keyframes sw{from{transform:rotate(-40deg)}to{transform:rotate(40deg)}}
.pg{animation:zm .35s ease-out}.fl{animation:fl 3.5s ease-in-out infinite}.sp{animation:sp 24s linear infinite;transform-origin:center}.bl{animation:bl .8s infinite}
input[type=range]{width:100%;accent-color:#00E5FF;height:36px}
.up{color:#FF1744}.dn{color:#00E676}
</style></head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const {useState,useEffect,useRef}=React, h=htm.bind(React.createElement);
// [name,mass,power,cost,dv,reliability,desc]
const C=[['Structure',[['Al Frame',0,0,0,0,0,'Baseline'],['Carbon Truss',-60,0,3,25,2,'Lighter, costlier']]],
['Propulsion',[['Ion Thruster',0,0,0,0,0,'Isp 3000s'],['Hall Thruster XL',45,8,4,120,1,'More thrust, more power']]],
['Power',[['Solar Array A',0,0,0,0,0,'1.8 kW'],['Solar Array B',42,-6,3,0,2,'Bigger wings']]],
['Comms',[['Antenna A',0,0,0,0,0,'2.4 Mbps'],['Antenna B',38,5,4,0,6,'4.8 Mbps, high gain']]],
['Science',[['Camera + Spec',0,0,0,0,0,'Standard'],['+Radar Sounder',55,12,6,-20,1,'Subsurface data']]],
['Thermal',[['Passive Radiators',0,0,0,0,0,'Basic'],['Active Loop',30,4,2,0,5,'Resists storms']]],
['Navigation',[['Star Tracker',0,0,0,0,0,'Std'],['Optical Nav',12,2,2,0,3,'Precise approach']]],
['Computing',[['Flight CPU',0,0,0,0,0,'Std'],['Rad-Hard CPU',10,3,3,0,4,'Safer in storms']]]];
const tot=inst=>{let m=2430,p=62,b=42,d=1450,r=82;C.forEach(([n,o],i)=>{const x=o[inst[i]||0];m+=x[1];p+=x[2];b-=x[3];d+=x[4];r+=x[5]});if(m>2500)r-=8;if(b<0)r-=8;if(p>100)r-=8;return{m,p,b,d,r:Math.max(30,Math.min(99,r))}};
const init={page:1,inst:{},mode:'COMMANDER',day:1,speed:1,fuel:85,health:100,data:18.4,sci:0,ret:0,pw:{science:30,comms:25,computing:25,thermal:20},pri:{s:1,v:1,a:1},safe:false,stormDone:false,stormChoice:null,surveys:0,tx:0,toast:null,flash:null,tab:0,cmp:null,mtab:0,hit:0};
const Btn=({children,onClick,p,dis,why,set})=>h`<button className=${'btn '+(p?'p ':'')+(dis?'off':'')} onClick=${()=>dis?set({toast:why}):onClick()}>${children}</button>`;
const Sheet=({children,onClose})=>h`<div className="sheet"><div className="mx-auto mb-3 h-1 w-10 rounded bg-[#293342]" onClick=${onClose}></div>${children}</div>`;
const Bar=({v,c='#00E5FF',l})=>h`<div className="mb-2"><div className="flex justify-between text-xs text-[#AAB4C3] mono"><span>${l}</span><span>${Math.round(v)}%</span></div><div className="h-2 rounded bg-[#0D111A]"><div style=${{width:Math.max(0,Math.min(100,v))+'%',background:c,transition:'width .5s'}} className="h-2 rounded"></div></div></div>`;
const Sat=({s=1,onPin})=>h`<svg viewBox="0 0 300 200" width="100%" height="100%"><g transform=${'translate(150 100) scale('+s+')'}><rect x="-110" y="-18" width="70" height="36" fill="#0b3b55" stroke="#00E5FF"/><rect x="40" y="-18" width="70" height="36" fill="#0b3b55" stroke="#00E5FF"/><rect x="-38" y="-30" width="76" height="60" rx="8" fill="#1d2636" stroke="#AAB4C3"/><circle cx="0" cy="-42" r="9" fill="none" stroke="#00E5FF"/><rect x="-10" y="30" width="20" height="14" fill="#FFAB00"/>${[[-70,0,2],[0,-42,3],[0,37,1],[-25,0,0],[25,0,4],[70,0,5],[0,10,6],[15,-18,7]].map(([x,y,i])=>h`<circle key=${i} cx=${x} cy=${y} r="5" fill="#00E5FF" opacity=".8" onClick=${()=>onPin&&onPin(i)} style=${{cursor:'pointer'}}><animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/></circle>`)}</g></svg>`;
const Asteroid=({rot,size=70})=>h`<svg viewBox="-100 -100 200 200" width=${size*2} height=${size*2}><circle r="80" fill="#2a2f3a" stroke="#00E5FF" strokeDasharray="4 4"/>${[0,1,2,3,4].map(i=>{const a=i*1.3+rot;return Math.cos(a)>0?h`<ellipse key=${i} cx=${Math.sin(a)*55} cy=${(i-2)*18} rx=${14*Math.cos(a)+2} ry="12" fill="#1a1e27"/>`:null})}</svg>`;

function App(){
const [g,S]=useState(init);const set=p=>S(o=>({...o,...(typeof p==='function'?p(o):p)}));const go=page=>set({page});
const T=tot(g.inst);const phase=g.day<5?'LAUNCH':g.day<60?'CRUISE':g.day<110?'APPROACH':g.day<130?'RENDEZVOUS':g.day<146?'SCIENCE':'DEBRIEF';
const [sc,setSc]=useState(1);useEffect(()=>{const f=()=>setSc(Math.min(1,(innerHeight-70)/852,innerWidth/393));f();addEventListener('resize',f);return()=>removeEventListener('resize',f)},[]);
useEffect(()=>{if(g.toast){const t=setTimeout(()=>set({toast:null}),2600);return()=>clearTimeout(t)}},[g.toast]);
useEffect(()=>{if(g.flash){const t=setTimeout(()=>set({flash:null}),1500);return()=>clearTimeout(t)}},[g.flash]);
const dash=g.page>=10&&g.page<=15&&g.page!==15||g.page===15;
// sim loop
useEffect(()=>{if(g.page!==10)return;const t=setInterval(()=>S(o=>{if(o.page!==10)return o;let nd=Math.min(146,o.day+o.speed);const ev=[[60,'Solar activity increasing'],[75,'Flare precursors detected on solar limb']];let toast=o.toast;for(const[d,m]of ev)if(o.day<d&&d<=nd){nd=d;toast=m}
if(!o.stormDone&&o.day<90&&90<=nd)return{...o,day:90,page:15};
if(nd>=146)return{...o,day:146,page:17};return{...o,day:nd,toast,data:Math.min(32,o.data+0.05*o.speed)}}),600);return()=>clearInterval(t)},[g.page]);
// save record on result
useEffect(()=>{if(g.page===17){try{const a=JSON.parse(localStorage.getItem('ll_rec')||'[]');a.unshift({sci:g.sci,hp:g.health,cost:+(42-T.b+42).toFixed(0),ret:g.ret,t:Date.now()});localStorage.setItem('ll_rec',JSON.stringify(a.slice(0,20)))}catch(e){}}},[g.page]);
const ctx={g,set,go,T,phase};
const pages={1:Landing,3:Brief,4:Setup,5:Design,6:Design,7:Ready,8:Stress,9:Launch,16:Rock,17:Result,18:Debrief,19:Board,20:Nasa};
const P=pages[g.page]||Dash;
return h`<div className="flex flex-col items-center py-2">
<select className="mb-2 rounded bg-[#151B26] px-3 py-2 text-xs mono text-[#00E5FF]" value=${g.page} onChange=${e=>go(+e.target.value)}>${Array.from({length:20},(_,i)=>h`<option key=${i} value=${i+1}>DEV · Page ${String(i+1).padStart(2,'0')}</option>`)}</select>
<div style=${{width:393*sc,height:852*sc}}><div className="relative overflow-hidden rounded-[36px] border border-[#293342] shadow-[0_0_80px_#00e5ff22]" style=${{width:393,height:852,background:'linear-gradient(#080B12,#0D111A)',transform:'scale('+sc+')',transformOrigin:'top left'}}>
<div key=${g.page>=10&&g.page<=15?10:g.page} className="pg absolute inset-0 overflow-auto"><${P} ...${ctx}/></div>
${g.page===2||g.page===1&&g.how?null:null}
${g.how?h`<${Sheet} onClose=${()=>set({how:0})}><${How} ...${ctx}/><//>`:null}
${g.safe?h`<div className="pointer-events-none absolute inset-0 z-40" style=${{background:'repeating-linear-gradient(0deg,#ffab0020 0 2px,transparent 2px 6px),#ffab0012',boxShadow:'inset 0 0 60px #FFAB0066'}}><div className="mono absolute top-2 w-full text-center text-[10px] text-[#FFAB00]">SAFE MODE ACTIVE</div></div>`:null}
${g.toast?h`<div className="mono absolute left-4 right-4 top-6 z-50 rounded-xl border border-[#00E5FF] bg-[#0D111A] p-3 text-center text-xs">${g.toast}</div>`:null}
</div></div></div>`}

function How({g,set,go}){const [i,setI]=useState(0);const [x,setX]=useState(0);const cs=[['Design Spacecraft','Pick components for 8 subsystems.'],['Manage Trade-Offs','Mass, power, cost and delta-v are always in tension.'],['Stress Test','Simulate storms and failures before launch.'],['Command Flight','Burn, observe, manage power, comms and science.'],['Complete Mission','Return data and keep the craft alive.']];
return h`<div onTouchStart=${e=>setX(e.touches[0].clientX)} onTouchEnd=${e=>{const d=e.changedTouches[0].clientX-x;if(d<-40)setI(Math.min(4,i+1));if(d>40)setI(Math.max(0,i-1))}}><div className="card mb-3 h-60 text-center"><div className="mono text-[#00E5FF]">${i+1} / 5</div><div className="mt-10 text-2xl font-bold">${cs[i][0]}</div><p className="mt-3 text-[#AAB4C3]">${cs[i][1]}</p><div className="mt-2 text-xs text-[#6F7B8C]">swipe ◂ ▸</div></div><div className="mb-3 flex justify-center gap-2">${cs.map((_,k)=>h`<span key=${k} className="h-2 w-2 rounded-full" style=${{background:k===i?'#00E5FF':'#293342'}}></span>`)}</div><div className="grid gap-2"><${Btn} p=${1} set=${set} onClick=${()=>{set({how:0});go(3)}}>START TUTORIAL<//><${Btn} set=${set} onClick=${()=>set({how:0})}>SKIP<//></div></div>`}

function Landing({set,go}){return h`<div className="flex h-full flex-col items-center justify-between p-6 pt-20">
<div className="fl h-48 w-64"><${Sat}/></div>
<div className="text-center"><div className="text-[28px] font-bold">MISSION: LAST LIGHT</div><div className="mono mt-2 text-xs tracking-widest text-[#00E5FF]">DESIGN. STRESS-TEST. ADAPT. SURVIVE.</div></div>
<div className="w-full space-y-3 pb-8"><${Btn} p=${1} set=${set} onClick=${()=>go(3)}>START MISSION<//><${Btn} set=${set} onClick=${()=>set({how:1})}>HOW TO PLAY<//><${Btn} set=${set} onClick=${()=>go(20)}>NASA DATA<//></div></div>`}

function Brief({g,set,go}){const [ck,setCk]=useState([0,0,0,0]);const [o,setO]=useState(1);const ob=['Rendezvous with ASTERIA-1','Collect 60+ science points','Return 15+ GB of data','Keep health above 40%'];
return h`<div className="p-4 pb-28"><div className="mb-3 flex justify-center"><svg viewBox="-60 -60 120 120" width="150"><g className="sp"><circle r="48" fill="none" stroke="#00E5FF"/><ellipse rx="48" ry="16" fill="none" stroke="#00E5FF" opacity=".6"/><ellipse rx="16" ry="48" fill="none" stroke="#00E5FF" opacity=".6"/></g></svg></div>
<div className="mono mb-3 text-center text-sm text-[#00E5FF]">ASTERIA-1 · Ø 1.2 km · 146 d transit</div>
<div className="card mb-3"><div className="mb-2 font-bold">OBJECTIVES</div>${ob.map((t,i)=>h`<label key=${i} className="flex min-h-[44px] items-center gap-3 text-sm"><input type="checkbox" className="h-5 w-5" checked=${!!ck[i]} onChange=${()=>setCk(ck.map((v,k)=>k===i?+!v:v))}/>${i<2?'Primary':'Secondary'}: ${t}</label>`)}</div>
<div className="card"><div className="flex min-h-[44px] items-center justify-between font-bold" onClick=${()=>setO(!o)}>CONSTRAINTS<span>${o?'−':'+'}</span></div>${o?h`<div className="mono text-sm text-[#AAB4C3]"><div>Mass ≤ 2500 kg</div><div>Budget ≤ $50M</div><div>Power ≤ 100 W</div></div>`:null}</div>
<div className="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-[#080B12] to-transparent"><${Btn} p=${1} set=${set} onClick=${()=>go(4)}>ACCEPT MISSION<//></div></div>`}

function Setup({g,set,go}){const L=['LOW','MED','HIGH'];const rows=[['SCIENCE PRIORITY','s'],['SURVIVABILITY','v'],['AFFORDABILITY','a']];
return h`<div className="p-4"><div className="mb-4 mt-6 text-xl font-bold">Mission Priorities</div>${rows.map(([t,k])=>h`<div key=${k} className="card mb-3"><div className="flex justify-between"><span className="text-sm">${t}</span><b className="mono text-[#00E5FF]">${L[g.pri[k]]}</b></div><input type="range" min="0" max="2" value=${g.pri[k]} onChange=${e=>set({pri:{...g.pri,[k]:+e.target.value}})}/><div className="mono flex justify-between text-[10px] text-[#6F7B8C]"><span>LOW</span><span>MED</span><span>HIGH</span></div></div>`)}<div className="absolute bottom-4 left-4 right-4"><${Btn} p=${1} set=${set} onClick=${()=>go(5)}>CONTINUE TO DESIGN<//></div></div>`}

function Design({g,set,go,T}){const cat=C[g.tab];const inst=g.inst[g.tab]||0;const fl=g.flash||{};
const badge=(k,v,u)=>h`<div className="pill mono">${k} <b className=${fl[k]>0?'up bl':fl[k]<0?'dn bl':''}>${v}${u}</b>${fl[k]?h`<span className=${fl[k]>0?'up':'dn'}> ${fl[k]>0?'+':''}${fl[k]}</span>`:null}</div>`;
const install=i=>{const a=cat[1][inst],b=cat[1][i];set({inst:{...g.inst,[g.tab]:i},cmp:null,page:5,flash:{Mass:b[1]-a[1],Power:b[2]-a[2],'$M':b[3]-a[3],'Δv':b[4]-a[4]}})};
const cmpOpen=g.page===6;
return h`<div className="flex h-full flex-col"><div className="flex-none p-3" style=${{height:'38%'}}><div className="flex flex-wrap gap-1">${badge('Mass',T.m,'kg')}${badge('Power',T.p,'W')}${badge('$M',(42-T.b).toFixed(0),'M')}${badge('Δv',T.d,'')}</div><div className="h-[75%]"><${Sat} onPin=${i=>set({tab:i})}/></div></div>
<div className="flex flex-none gap-2 overflow-x-auto px-3 pb-2">${C.map(([n],i)=>h`<button key=${n} onClick=${()=>set({tab:i})} className="pill min-h-[44px] whitespace-nowrap" style=${{borderColor:i===g.tab?'#00E5FF':'#293342',color:i===g.tab?'#00E5FF':'#AAB4C3'}}>${n}</button>`)}</div>
<div className="flex-1 space-y-2 overflow-auto px-3 pb-24">${cat[1].map((c,i)=>h`<div key=${i} className="card" style=${{borderColor:i===inst?'#00E5FF':'#293342'}}><div className="flex justify-between"><b>${c[0]}</b><span className="mono text-xs text-[#AAB4C3]">${c[1]}kg · ${c[2]}W · $${c[3]}M</span></div><div className="mb-2 text-xs text-[#6F7B8C]">${c[6]}</div><div className="flex gap-2"><div className="flex-1"><${Btn} p=${i!==inst} set=${set} onClick=${()=>install(i)}>${i===inst?'INSTALLED':'INSTALL'}<//></div><div className="flex-1"><${Btn} set=${set} onClick=${()=>set({page:6,cmp:i})}>COMPARE<//></div></div></div>`)}</div>
<div className="absolute bottom-3 left-3 right-3"><${Btn} p=${1} set=${set} onClick=${()=>go(7)}>MISSION READINESS<//></div>
${cmpOpen?h`<${Sheet} onClose=${()=>go(5)}><div className="mb-2 font-bold">COMPARE · ${cat[0]}</div><div className="grid grid-cols-2 gap-2 text-sm">${[inst,g.cmp==null?1:g.cmp].map((ix,k)=>{const c=cat[1][ix],b=cat[1][inst];return h`<div key=${k} className="card"><b>${c[0]}</b>${[['Mass',c[1],b[1],1],['Power',c[2],b[2],1],['Cost',c[3],b[3],1],['Δv',c[4],b[4],-1],['Reliab.',c[5],b[5],-1]].map(([n,v,w,s])=>{const d=(v-w)*s;return h`<div key=${n} className="mono mt-2 text-xs">${n}: ${v}${k&&d?h`<span className=${'ml-1 rounded px-1 '+(d<0?'bg-[#00E67633] dn':'bg-[#FF174433] up')}>${d<0?'ADV':'PEN'}</span>`:null}</div>`})}</div>`})}</div><div className="mt-3 grid gap-2"><${Btn} p=${1} set=${set} onClick=${()=>install(g.cmp==null?1:g.cmp)}>INSTALL THIS<//><${Btn} set=${set} onClick=${()=>go(5)}>CANCEL<//></div><//>`:null}</div>`}

function Ready({g,set,go,T}){const eng=g.mode==='ENGINEER';const r=T.r;const risk=(g.inst[3]||0)===0?'COMMUNICATION CAPACITY':T.p>90?'POWER MARGIN':'THERMAL RESILIENCE';const col=r>=80?'#00E676':r>=60?'#FFAB00':'#FF1744';
return h`<div className="p-4 pb-24"><div className="flex items-center justify-between"><div className="text-lg font-bold">Readiness</div><button className="pill min-h-[44px]" onClick=${()=>set({mode:eng?'COMMANDER':'ENGINEER'})}>${g.mode}</button></div>
<div className="my-3 flex justify-center"><svg viewBox="0 0 120 120" width="170"><circle cx="60" cy="60" r="50" fill="none" stroke="#293342" strokeWidth="10"/><circle cx="60" cy="60" r="50" fill="none" stroke=${col} strokeWidth="10" strokeDasharray=${r*3.14+' 314'} transform="rotate(-90 60 60)" strokeLinecap="round" style=${{transition:'all .6s'}}/><text x="60" y="68" textAnchor="middle" fill="#F3F6FA" fontSize="26" className="mono">${r}%</text></svg></div>
<div className="card mb-3 bl" style=${{borderColor:'#FFAB00',color:'#FFAB00'}}>⚠ PRIMARY RISK: ${risk}</div>
<${Bar} l="Power" v=${100-T.p+20} c="#00E676"/><${Bar} l="Comms" v=${60+(g.inst[3]?35:0)}/><${Bar} l="Thermal" v=${55+(g.inst[5]?35:0)}/><${Bar} l="Propulsion" v=${T.d/20}/><${Bar} l="Reliability" v=${r}/><${Bar} l="Budget" v=${T.b*2} c="#FFAB00"/>
${eng?h`<div className="card mono text-xs text-[#AAB4C3]"><div>Δv: ${T.d} m/s · Isp 3000 s</div><div>Mass: ${T.m} kg · Power ${T.p}/100 W</div><div>Link: ${g.inst[3]?'4.8':'2.4'} Mbps @ 1.2 AU, margin ${g.inst[3]?'+6.1':'+1.8'} dB</div></div>`:null}
<div className="absolute bottom-4 left-4 right-4"><${Btn} p=${1} set=${set} onClick=${()=>go(8)}>CONTINUE TO STRESS TEST<//></div></div>`}

const SC=[['Solar Storm',30],['Comms Failure',15],['Thermal Stress',22],['Micrometeoroid',26],['Radiation Belt',20],['Power Dip',18],['Dust Cloud',12],['Eclipse Soak',10]];
function Stress({g,set,go,T}){const [sel,setSel]=useState(0);const [st,setSt]=useState({});const run=()=>{setSt({beam:1});setTimeout(()=>setSt(s=>({...s,drop:1})),400);setTimeout(()=>setSt(s=>({...s,res:1})),1400)};
const s=T.r-SC[sel][1]+((g.inst[5]||0)&&sel===2?10:0)+((g.inst[7]||0)&&sel===0?8:0);const res=s>=70?'SURVIVES NOMINAL':s>=48?'SURVIVES WITH DEGRADATION':'CRITICAL FAILURE';const dmg=Math.max(4,Math.round((92-s)/2));
return h`<div className="p-4"><div className="relative mb-3 h-40 overflow-hidden rounded-xl bg-[#0D111A]"><${Sat} s=${.8}/>${st.beam?h`<div className="absolute inset-0 bl" style=${{background:'linear-gradient(90deg,transparent,#FF174488,transparent)'}}></div>`:null}</div>
<${Bar} l="POWER" v=${st.drop?100-dmg:100} c="#FFAB00"/><${Bar} l="HEALTH" v=${st.drop?100-dmg*1.3:100} c="#00E676"/>
<div className="my-3 grid grid-cols-2 gap-2">${SC.map(([n],i)=>h`<button key=${n} className="card min-h-[56px] text-sm" style=${{borderColor:i===sel?'#00E5FF':'#293342'}} onClick=${()=>{setSel(i);setSt({})}}>${n}</button>`)}</div>
<div className="absolute bottom-4 left-4 right-4"><${Btn} p=${1} set=${set} onClick=${run}>RUN TEST<//></div>
${st.res?h`<${Sheet} onClose=${()=>setSt({})}><div className=${'mono mb-1 text-xs '+(s>=48?'text-[#FFAB00]':'up')}>TEST RESULT</div><div className="mb-1 text-lg font-bold">${res}</div><div className="mb-3 text-sm text-[#AAB4C3]">${SC[sel][0]}: est. ${dmg}% damage. Score ${Math.round(s)}.</div><div className="grid gap-2"><${Btn} set=${set} onClick=${()=>go(5)}>REDESIGN<//><${Btn} set=${set} onClick=${()=>{setSt({});setTimeout(run,50)}}>RUN AGAIN<//><${Btn} p=${1} set=${set} onClick=${()=>go(9)}>LAUNCH ANYWAY<//></div><//>`:null}</div>`}

function Launch({g,set,go,T}){const [n,setN]=useState(null);useEffect(()=>{if(n===null)return;if(n<0){set({toast:'MISSION CONTROL: ASTERIA-1 is now in space.',fuel:85,health:100});const t=setTimeout(()=>set({page:10,day:1}),1200);return()=>clearTimeout(t)}const t=setTimeout(()=>setN(n-1),n===0?1500:800);return()=>clearTimeout(t)},[n]);
if(n!==null)return h`<div className="flex h-full items-center justify-center bg-black">${n>0?h`<div key=${n} className="pg mono text-[140px] font-bold text-[#00E5FF]">${n}</div>`:n===0?h`<div><div className="mono text-center text-3xl text-[#FFAB00]">IGNITION</div>${Array.from({length:14},(_,i)=>h`<span key=${i} className="absolute h-8 w-1 rounded bg-[#FFAB00]" style=${{left:150+i*7,top:0,animation:'rk '+(0.9+i%4*.15)+'s linear infinite',animationDelay:i*.05+'s'}}></span>`)}</div>`:h`<div className="mono text-[#00E676]">IN ORBIT</div>`}</div>`;
return h`<div className="flex h-full flex-col justify-between p-5 pt-16"><div className="text-center text-2xl font-bold">LAUNCH AUTHORIZATION</div><div className="space-y-3"><div className="card flex justify-between"><span>Readiness</span><b className="mono">${T.r}%</b></div><div className="card flex justify-between"><span>Δv margin</span><b className="mono">+${T.d-1199} m/s</b></div><div className="card flex justify-between"><span>Primary risk</span><b className="text-[#FFAB00]">${(g.inst[3]||0)?'Solar storm':'Comms capacity'}</b></div></div><${Btn} p=${1} set=${set} onClick=${()=>setN(10)}>CONFIRM LAUNCH<//></div>`}

function Dash({g,set,go,phase}){const sh=g.page>10?g.page:null;const [pan,setPan]=useState([0,0]);const [z,setZ]=useState(1);const [drag,setDrag]=useState(null);const [sw,setSw]=useState(false);const [bm,setBm]=useState(0);const [pulse,setPulse]=useState(false);const [txv,setTxv]=useState(null);const [fire,setFire]=useState(0);
const t=g.day/146;const bz=(a,b,c,t)=>(1-t)*(1-t)*a+2*(1-t)*t*b+t*t*c;const cp=[[200,420],[260,120]][g.mtab>0&&g.mtab<3?1:0];const sx=bz(80,cp[0]*.8,310,t),sy=bz(300,cp[1],200,t);
const eg=g.pw.science>=70;const close=()=>set({page:10});const win=g.day%30<20;
const doTx=()=>{if(!win)return set({toast:'No communication window available'});if(g.data<=0.1)return set({toast:'Transmission queue empty'});const amt=g.data;let v=amt;setTxv(amt);const iv=setInterval(()=>{v-=amt/12;if(v<=0){clearInterval(iv);set(o=>({data:0,ret:o.ret+amt,tx:o.tx+1,toast:'+'+amt.toFixed(1)+' GB Transmitted'}));setTxv(null)}else setTxv(v)},120)};
const scan=(n,cost)=>{if(g.safe)return set({toast:'Safe mode active — instruments offline'});if(g.data+2.8>32)return set({toast:'Data storage full — transmit first'});setSw(true);setTimeout(()=>{setSw(false);set(o=>({sci:o.sci+8,data:o.data+2.8,toast:'+8 Science Points / +2.8 GB Data'}))},1600)};
const exec=()=>{if(g.fuel<8)return set({toast:'Insufficient propellant'});setPulse(true);setTimeout(()=>setPulse(false),700);set({fuel:g.fuel-8,toast:'Burn complete: −84 m/s, −120 kg'})};
const storm=c=>{const sh2=(g.inst[5]||0)+(g.inst[7]||0);if(c==='safe')set({safe:true,stormDone:true,stormChoice:'safe',page:10,toast:'Safe mode: computer protected, power reduced'});else if(c==='sci')set({stormDone:true,stormChoice:'sci',sci:g.sci+12,data:Math.min(32,g.data+4),health:g.health-(sh2?18:34),page:10,toast:'Extra data gathered — damage taken'});else set({stormDone:true,stormChoice:'power',pw:{science:10,comms:20,computing:25,thermal:45},health:g.health-(sh2?4:12),page:10,toast:'Power redistributed to thermal'})};
const dock=[['⌖','MANEUVER',()=>set({page:11})],['◉','OBSERVE',()=>set({page:14})],['⚡','POWER',()=>set({page:12})],['📡','COMMS',()=>set({page:13})],['⚗','SCIENCE',()=>set({page:14})],['⛨','SAFE MODE',()=>set({safe:!g.safe,toast:g.safe?'Safe mode off':'Safe mode on'})]];
return h`<div className="relative h-full overflow-hidden">
<div className="absolute left-0 right-0 top-0 z-10 flex items-center gap-1 p-3 pt-4"><div className="pill mono">${phase}</div><div className="pill mono">Day ${g.day}/146</div><div className=${'pill mono '+(eg?'bl':'')} style=${{color:eg?'#FFAB00':'#00E676'}}>THERM ${eg?'WARN':'OK'}</div><div className="flex-1"></div>${[1,5,20,100].map(s=>h`<button key=${s} className="pill min-h-[32px]" style=${{color:g.speed===s?'#00E5FF':'#AAB4C3',borderColor:g.speed===s?'#00E5FF':'#293342'}} onClick=${()=>set({speed:s})}>${s}X</button>`)}</div>
<svg viewBox="0 0 393 560" className="absolute inset-0 h-full w-full touch-none" style=${{marginTop:30}} onPointerDown=${e=>setDrag([e.clientX,e.clientY])} onPointerMove=${e=>{if(drag){setPan([pan[0]+e.clientX-drag[0],pan[1]+e.clientY-drag[1]]);setDrag([e.clientX,e.clientY])}}} onPointerUp=${()=>setDrag(null)} onPointerLeave=${()=>setDrag(null)}>
<g transform=${'translate('+pan[0]+' '+pan[1]+') scale('+z+')'}>${Array.from({length:30},(_,i)=>h`<circle key=${i} cx=${(i*97)%393} cy=${(i*61)%560} r=${i%3?.8:1.4} fill="#fff" opacity=".5"/>`)}
<path d=${'M80 300 Q '+cp[0]*.8+' '+cp[1]+' 310 200'} fill="none" stroke="#00E676" strokeWidth="2" strokeDasharray="6 4"/>
<circle cx="80" cy="300" r="34" fill="#12467a" stroke="#00E5FF"/><text x="80" y="345" fill="#AAB4C3" fontSize="10" textAnchor="middle">EARTH</text>
<circle cx="310" cy="200" r="16" fill="#3a3f4b" stroke="#AAB4C3" onClick=${()=>go(16)}/><text x="310" y="232" fill="#AAB4C3" fontSize="10" textAnchor="middle">ASTERIA-1</text>
<g transform=${'translate('+sx+' '+sy+')'}><circle r=${pulse?18:7} fill=${pulse?'#FFAB0055':'#00E5FF'} style=${{transition:'r .3s'}}/><rect x="-4" y="-4" width="8" height="8" fill="#F3F6FA"/>${sw?h`<path d="M0 0 L120 -45 A128 128 0 0 1 120 45 Z" fill="#00E5FF" opacity=".25" style=${{transformOrigin:'0 0',animation:'sw 1.6s ease-in-out'}}/>`:null}</g></g></svg>
<div className="absolute right-3 top-24 z-10 flex flex-col gap-1"><button className="pill min-h-[44px] min-w-[44px]" onClick=${()=>setZ(Math.min(2.5,z+.25))}>＋</button><button className="pill min-h-[44px] min-w-[44px]" onClick=${()=>setZ(Math.max(.6,z-.25))}>－</button></div>
<div className="absolute left-3 top-24 z-10 flex flex-col gap-1">${[['Power','1.82 kW'],['Fuel',Math.round(g.fuel*15.1)+' kg'],['Health',Math.round(g.health)+'%'],['Data',(txv??g.data).toFixed(1)+' GB']].map(([k,v])=>h`<div key=${k} className="pill mono">${k} <b className="text-[#00E5FF]">${v}</b></div>`)}</div>
<div className="absolute bottom-0 left-0 right-0 z-20 grid grid-cols-6 gap-1 border-t border-[#293342] bg-[#0D111Aee] p-2 pb-4">${dock.map(([i,l,f])=>h`<button key=${l} onClick=${f} className="min-h-[56px] rounded-lg text-center active:scale-95" style=${{color:l==='SAFE MODE'&&g.safe?'#FFAB00':'#F3F6FA'}}><div className="text-lg">${i}</div><div className="text-[7px] tracking-tight">${l}</div></button>`)}</div>
${sh===11?h`<${Sheet} onClose=${close}><div className="mb-2 flex gap-1">${['Course Correction','Approach Burn','Rendezvous Burn'].map((n,i)=>h`<button key=${n} className="pill min-h-[40px] flex-1 text-[10px]" style=${{color:g.mtab===i?'#00E5FF':'#AAB4C3',borderColor:g.mtab===i?'#00E5FF':'#293342'}} onClick=${()=>set({mtab:i})}>${n}</button>`)}</div><div className="card mono mb-3 text-sm"><div>Miss distance: ${[42000,18000,6000][g.mtab].toLocaleString()} km ➔ <b className="dn">${[2100,900,300][g.mtab].toLocaleString()} km</b></div><div>Δv cost: <b className="up">−84 m/s</b></div><div>Propellant: <b className="up">−120 kg</b></div></div><${Btn} p=${1} set=${set} onClick=${exec}>EXECUTE MANEUVER<//><//>`:null}
${sh===12?h`<${Sheet} onClose=${close}><div className="mb-2 font-bold">POWER MANAGEMENT</div>${['science','comms','computing','thermal'].map(k=>h`<div key=${k}><div className="mono flex justify-between text-xs"><span>${k.toUpperCase()}</span><span>${g.pw[k]}%</span></div><input type="range" min="0" max="100" value=${g.pw[k]} onChange=${e=>set({pw:{...g.pw,[k]:+e.target.value}})}/></div>`)}<div className="mono mb-2 text-xs text-[#AAB4C3]">Total ${Object.values(g.pw).reduce((a,b)=>a+b,0)}% (normalised on apply)</div><${Btn} p=${1} set=${set} onClick=${()=>{const s=Object.values(g.pw).reduce((a,b)=>a+b,0)||1;const n={};for(const k in g.pw)n[k]=Math.round(g.pw[k]*100/s);set({pw:n,page:10,toast:'Power configuration applied'})}}>APPLY POWER CONFIGURATION<//><//>`:null}
${sh===13?h`<${Sheet} onClose=${close}><div className="mb-2 font-bold">COMMUNICATIONS</div><svg viewBox="0 0 340 50" className="w-full"><circle cx="15" cy="25" r="8" fill="#00E5FF"/><circle cx="325" cy="25" r="8" fill="#00E676"/><path d="M25 25 Q 60 5 95 25 T 165 25 T 235 25 T 305 25" fill="none" stroke="#00E5FF" strokeDasharray="4 3"><animate attributeName="stroke-dashoffset" values="14;0" dur="1s" repeatCount="indefinite"/></path>${txv!=null?[0,1,2,3,4].map(i=>h`<circle key=${i} r="4" cy="25" fill="#00E5FF"><animate attributeName="cx" values="20;320" dur="1s" begin=${i*.2+'s'} repeatCount="indefinite"/></circle>`):null}</svg><div className="mono my-2 grid grid-cols-2 gap-2 text-xs"><div className="card">Signal ${win?'STRONG':'NONE'}</div><div className="card">Rate ${g.inst[3]?'4.8':'2.4'} Mbps</div><div className="card">Latency ${(g.day/146*8+4).toFixed(1)} min</div><div className="card">Window ${win?'OPEN':'CLOSED'}</div></div><${Bar} l=${'Queue '+(txv??g.data).toFixed(1)+' GB'} v=${(txv??g.data)/32*100}/><${Btn} p=${1} dis=${!win} why="No communication window available" set=${set} onClick=${doTx}>TRANSMIT NOW<//><//>`:null}
${sh===14?h`<${Sheet} onClose=${close}><div className="mb-2 font-bold">SCIENCE OPERATIONS</div>${[['Camera','4W · 20s'],['Spectrometer','9W · 45s'],['Radar','14W · 60s'],['Thermal Sensor','6W · 30s']].map(([n,c])=>h`<div key=${n} className="card mb-2 flex items-center justify-between gap-2"><div><b>${n}</b><div className="mono text-xs text-[#6F7B8C]">${c}</div></div><div className="w-36"><${Btn} p=${1} set=${set} onClick=${()=>scan(n)}>EXECUTE SCAN<//></div></div>`)}<${Btn} set=${set} dis=${g.day<110} why="Asteroid not yet in range (Day 110+)" onClick=${()=>go(16)}>SURFACE SURVEY<//><//>`:null}
${sh===15?h`<div className="absolute inset-0 z-30 flex items-end bg-black/70"><div className="sheet bl" style=${{borderColor:'#FF1744',borderWidth:3,animation:'up .3s ease-out'}}><div className="mono mb-1 text-center font-bold up">HIGH ALERT: SOLAR STORM DETECTED</div><p className="mb-3 text-center text-sm text-[#AAB4C3]">Particle flux rising. Decide now.</p><div className="grid gap-2"><${Btn} set=${set} onClick=${()=>storm('safe')}>SAFE MODE<//><${Btn} set=${set} onClick=${()=>storm('sci')}>CONTINUE SCIENCE<//><${Btn} set=${set} onClick=${()=>storm('power')}>REDISTRIBUTE POWER<//></div></div></div>`:null}
</div>`}

function Rock({g,set,go}){const [rot,setRot]=useState(0);const [d,setD]=useState(null);const [pin,setPin]=useState(null);const pins=['Region A','Region B','Region C'];
return h`<div className="flex h-full flex-col items-center p-4 pt-10"><div className="mono mb-2 text-[#00E5FF]">ASTERIA-1 · SURFACE</div><div className="touch-none cursor-grab" onPointerDown=${e=>setD(e.clientX)} onPointerMove=${e=>{if(d!=null){setRot(rot+(e.clientX-d)/60);setD(e.clientX)}}} onPointerUp=${()=>setD(null)} onPointerLeave=${()=>setD(null)} style=${{position:'relative',width:300,height:300}}><${Asteroid} rot=${rot} size=${150}/>${pins.map((p,i)=>{const a=i*2.1+rot;return Math.cos(a)>0?h`<button key=${p} className="pill absolute min-h-[44px] min-w-[44px]" style=${{left:150+Math.sin(a)*105-22,top:130+i*30-20,color:'#00E5FF'}} onClick=${()=>setPin(p)}>${p.slice(-1)}</button>`:null})}</div><div className="mono text-xs text-[#6F7B8C]">drag to rotate · tap a pin</div>
<div className="mt-auto w-full"><${Btn} set=${set} onClick=${()=>go(10)}>BACK TO FLIGHT<//></div>
${pin?h`<${Sheet} onClose=${()=>setPin(null)}><div className="mb-1 font-bold">${pin}</div><p className="mb-3 text-sm text-[#AAB4C3]">Regolith with olivine signatures. Est. +10 science.</p><${Btn} p=${1} set=${set} dis=${g.data+1.2>32} why="Data storage full — transmit first" onClick=${()=>{set({sci:g.sci+10,data:g.data+1.2,surveys:g.surveys+1,toast:'+10 Science / +1.2 GB'});setPin(null)}}>SCAN TARGET<//><//>`:null}</div>`}

const ok=g=>g.health>=40&&g.sci>=30;
function Result({g,set,go,T}){const win=ok(g);return h`<div className="p-4 pb-40"><div className="mx-auto mb-4 mt-8 w-fit rounded-full px-6 py-2 font-bold" style=${{background:win?'#00E67622':'#FFAB0022',color:win?'#00E676':'#FFAB00',border:'1px solid'}}>${win?'MISSION COMPLETE':'MISSION FAILED'}</div>${[['Science',g.sci+' pts'],['Data Returned',g.ret.toFixed(1)+' GB'],['Final Health',Math.round(Math.max(0,g.health))+'%'],['Cost','$'+(42-T.b).toFixed(0)+'M'],['Duration',g.day+' Days']].map(([k,v])=>h`<div key=${k} className="card mono mb-2 flex justify-between"><span>${k}</span><b className="text-[#00E5FF]">${v}</b></div>`)}
${win?null:h`<div className="card text-sm" style=${{borderColor:'#FFAB00'}}><b>Cause & Effect</b><p className="mt-1 text-[#AAB4C3]">${g.health<40?'Storm and thermal damage drove health below the survival threshold.':'Too little science was returned: scans and transmissions fell short of the 30-point minimum.'}</p></div>`}
<div className="absolute bottom-0 left-0 right-0 grid gap-2 bg-[#080B12] p-4"><${Btn} p=${1} set=${set} onClick=${()=>go(18)}>VIEW CINEMATIC DEBRIEF<//><${Btn} set=${set} onClick=${()=>S0(set)}>RETRY MISSION<//></div></div>`}
const S0=set=>set({...init,page:5,inst:{}});

function Debrief({g,T}){const [n,setN]=useState(0);const st=g.stormChoice;
const N=[['Launch','Launched at '+T.r+'% readiness','Your design set the margins you flew with.','Δv margin '+(T.d-1199)+' m/s and '+T.p+' W load defined every later option.','Constraints stayed tight, so every burn mattered.'],
['Solar Storm',{safe:'Entered Safe Mode',sci:'Kept running science',power:'Redistributed power to thermal'}[st]||'No storm decision','Flux spiked on Day 90 as foreshadowed.',st==='safe'?'Hardware protected, but science paused':st==='sci'?'Extra data, but heavy damage':'Moderate damage, preserved systems','Health ended at '+Math.round(g.health)+'%.'],
['Rendezvous',g.surveys+' surface surveys','Close approach opened regional scan targets.','Region scans add science and data.','Science total: '+g.sci+' pts.'],
['Transmission',g.tx+' downlinks','Data only counts when it reaches Earth.','Windows open 20 of every 30 days; antenna sets the rate.',g.ret.toFixed(1)+' GB returned.']];
const x=N[n];return h`<div className="flex h-full flex-col"><div className="flex h-[20%] items-center gap-6 overflow-x-auto px-6">${N.map((a,i)=>h`<button key=${i} onClick=${()=>setN(i)} className="flex-none text-center"><div className="mx-auto h-8 w-8 rounded-full bg-[#151B26]" style=${{boxShadow:i===n?'0 0 0 3px #00E5FF,0 0 18px #00E5FF':'none'}}></div><div className="mono mt-2 text-[10px]">${a[0]}</div></button>`)}</div><div className="h-[80%] space-y-2 overflow-auto p-4">${['Your Decision','What Happened','Why It Happened','Mission Consequence'].map((t,i)=>h`<div key=${t} className="card"><div className="mono text-[10px] text-[#00E5FF]">${t.toUpperCase()}</div><div className="text-sm">${x[i+1]}</div></div>`)}</div></div>`}

function Board({g,set}){const [t,setT]=useState(0);let a=[];try{a=JSON.parse(localStorage.getItem('ll_rec')||'[]')}catch(e){}
const key=['sci','hp','cost'][t];const arr=[...a].sort((p,q)=>t===2?p.cost-q.cost:q[key]-p[key]);
return h`<div className="p-4"><div className="mb-3 mt-6 text-xl font-bold">Mission Records</div><div className="mb-3 flex gap-1">${['Science Hunter','Survival Expert','Engineering Master'].map((n,i)=>h`<button key=${n} className="pill min-h-[44px] flex-1 text-[10px]" style=${{color:t===i?'#00E5FF':'#AAB4C3',borderColor:t===i?'#00E5FF':'#293342'}} onClick=${()=>setT(i)}>${n}</button>`)}</div>${arr.length?arr.map((r,i)=>h`<div key=${i} className="card mono mb-2 flex justify-between text-xs"><span>#${i+1} · ${new Date(r.t).toLocaleDateString()}</span><span>Sci ${r.sci} · HP ${Math.round(r.hp)}% · $${r.cost}M</span></div>`):h`<div className="card text-sm text-[#6F7B8C]">No saved missions yet. Finish a flight to log a record.</div>`}</div>`}

function Nasa({g,set,go}){const [o,setO]=useState(null);const it=[['JPL Horizons','Ephemerides for solar-system bodies and spacecraft.'],['Small-Body Database','Orbits and physical data for asteroids and comets.'],['Tsiolkovsky Rocket Equation','Δv = Isp · g₀ · ln(m₀ / m_f)\nTells how much velocity a burn buys for a given propellant mass.'],['Delta-v Budget','Δv_total = Σ Δv_burns + margin\nSum course corrections, approach and rendezvous burns, then add reserve.'],['Solar Inverse-Square Law','P = P₀ · (1 AU / r)²\nSolar power drops with the square of distance from the Sun.']];
return h`<div className="p-4"><div className="mb-3 mt-6 text-xl font-bold">NASA Data & Science</div>${it.map(([n,d],i)=>h`<div key=${n} className="card mb-2" onClick=${()=>setO(o===i?null:i)}><div className="flex min-h-[32px] justify-between font-bold"><span>${n}</span><span>${o===i?'−':'+'}</span></div>${o===i?h`<pre className="mono mt-2 whitespace-pre-wrap text-xs text-[#AAB4C3]">${d}</pre>`:null}</div>`)}<${Btn} set=${set} onClick=${()=>go(1)}>BACK<//></div>`}

ReactDOM.createRoot(document.getElementById('root')).render(h`<${App}/>`);
</script></body></html>
